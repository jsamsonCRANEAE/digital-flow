<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shift Zero: The Weight of Amperage</title>
  <meta name="description" content="A 2-player local asymmetric co-op action-RPG roguelite. Every pixel and every sound is synthesized at runtime." />
  <style>
/* SHIFT ZERO — industrial typography, oscilloscope animation, diegetic pager, CRT/film grain. */
:root {
  --ink: #e8e0c8;
  --dim: #8a8478;
  --amber: #ffcf70;
  --cyan: #50f0ff;
  --red: #ff5040;
  --steel: #3a3f44;
  --bg: #050607;
  --mono: "IBM Plex Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --ui-scale: 1;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font-family: var(--mono); overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
body { display: grid; place-items: center; }

#stage { position: relative; width: 1280px; height: 720px; background: #000; overflow: hidden; box-shadow: 0 0 80px rgba(0,0,0,0.9); }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
#ui { pointer-events: none; }

#dom-layer {
  position: absolute; left: 0; top: 0; width: 1280px; height: 720px;
  transform: scale(var(--ui-scale)); transform-origin: 0 0; pointer-events: none;
}

/* ------------------------------------------------------------------ CRT + film grain */
#crt { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#crt .scan {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,0.16) 3px, rgba(0,0,0,0) 4px);
  mix-blend-mode: multiply; animation: flicker 0.12s infinite steps(2);
}
#crt .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
#crt .grain {
  position: absolute; inset: -50%; opacity: 0.09;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: grain 0.6s steps(6) infinite;
}
@keyframes grain {
  0% { transform: translate(0,0); } 20% { transform: translate(-6%,4%); } 40% { transform: translate(5%,-7%); }
  60% { transform: translate(-3%,8%); } 80% { transform: translate(7%,2%); } 100% { transform: translate(0,0); }
}
@keyframes flicker { 0% { opacity: 0.95; } 100% { opacity: 1; } }

kbd {
  display: inline-block; min-width: 1.6em; padding: 1px 5px; margin: 0 2px;
  border: 1px solid #6a6458; border-bottom-width: 3px; border-radius: 3px;
  background: #1a1a18; color: var(--ink); font: bold 11px var(--mono); text-align: center;
}

/* ------------------------------------------------------------------ Pager */
#pager {
  position: absolute; right: 16px; top: 150px; width: 300px; z-index: 3;
  transform-origin: 100% 0; transition: opacity 0.4s;
}
#pager.idle { opacity: 0.45; }
.pager-body {
  background: linear-gradient(160deg, #2b2e2a, #151715); border-radius: 10px 10px 18px 18px;
  padding: 8px 10px 10px; border: 1px solid #44483f; box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
}
.pager-brand { font-size: 8px; letter-spacing: 3px; color: #8a8a78; margin-bottom: 4px; }
.pager-screen {
  background: #8fa76a; color: #142010; border-radius: 4px; padding: 6px 8px; min-height: 64px;
  box-shadow: inset 0 0 12px rgba(0,0,0,0.45); font-size: 11px; line-height: 1.35;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.12);
}
#pager-from { font-size: 8px; font-weight: bold; letter-spacing: 1px; border-bottom: 1px solid rgba(20,32,16,0.35); margin-bottom: 3px; }
#pager.unknown .pager-screen { background: #0b1e22; color: var(--cyan); text-shadow: 0 0 6px rgba(80,240,255,0.6); }
.pager-buttons { display: flex; gap: 8px; justify-content: center; margin-top: 6px; }
.pager-buttons i { width: 22px; height: 6px; background: #3a3d36; border-radius: 3px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.1); }
#pager.buzz { animation: buzz 0.09s linear 8; }
@keyframes buzz {
  0% { transform: translate(0,0) rotate(0); } 25% { transform: translate(-2px,1px) rotate(-0.6deg); }
  50% { transform: translate(2px,-1px) rotate(0.6deg); } 75% { transform: translate(-1px,-1px) rotate(-0.3deg); } 100% { transform: translate(0,0); }
}

/* ------------------------------------------------------------------ Overlay screens */
#overlay { position: absolute; inset: 0; z-index: 4; display: none; }
#overlay.active { display: block; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; animation: fadein 0.5s ease; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.hint { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--dim); letter-spacing: 1px; }
.hint.dim { opacity: 0.3; }

/* Title */
.title-screen { padding-top: 70px; background: linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(0,0,0,0) 40%, rgba(0,0,0,0.6)); }
.logo {
  position: relative; font: 900 96px/1 var(--mono); letter-spacing: 14px; color: var(--ink);
  text-shadow: 0 0 18px rgba(255,200,120,0.35), 0 0 2px #fff;
}
.logo::before, .logo::after {
  content: attr(data-text); position: absolute; inset: 0; overflow: hidden;
}
.logo::before { color: var(--cyan); transform: translate(-3px,0); clip-path: inset(0 0 60% 52%); animation: glitch 2.6s infinite steps(1); mix-blend-mode: screen; }
.logo::after { color: #ff5a3c; transform: translate(3px,0); clip-path: inset(55% 0 0 0); animation: glitch 3.1s infinite steps(1) reverse; mix-blend-mode: screen; opacity: 0.6; }
@keyframes glitch {
  0%, 86% { clip-path: inset(0 0 100% 0); }
  87% { clip-path: inset(10% 0 60% 50%); transform: translate(-6px,0); }
  90% { clip-path: inset(40% 0 30% 55%); transform: translate(5px,2px); }
  93% { clip-path: inset(70% 0 5% 50%); transform: translate(-3px,-1px); }
  96%, 100% { clip-path: inset(0 0 100% 0); }
}
.subtitle { margin-top: 14px; font-size: 20px; letter-spacing: 12px; color: var(--amber); }
.tagline { margin-top: 10px; font-size: 12px; color: var(--dim); letter-spacing: 1px; }
.press { margin-top: 40px; font-size: 16px; letter-spacing: 4px; color: var(--ink); text-shadow: 0 0 10px rgba(255,220,160,0.6); }
.press.dim { opacity: 0.35; }
.pads { margin-top: 10px; font-size: 12px; color: var(--dim); letter-spacing: 1px; }
.pads.on { color: var(--cyan); text-shadow: 0 0 8px rgba(80,240,255,0.5); }
.controls { display: flex; gap: 18px; margin-top: 34px; }
.controls .col { width: 340px; background: rgba(8,10,12,0.78); border: 1px solid var(--steel); padding: 10px 14px; font-size: 12px; }
.controls .col h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: 2px; }
.controls .col p { margin: 6px 0; color: #c8c0ac; }
.controls .body h3 { color: var(--amber); }
.controls .voxel h3 { color: var(--cyan); }
.controls .solo h3 { color: #c8c0ac; }
.endings { margin-top: 64px; font-size: 11px; color: var(--dim); text-align: center; }
.endings ul { list-style: none; padding: 0; margin: 6px 0 0; display: flex; gap: 16px; justify-content: center; }
.endings li { color: #4a4740; }
.endings li.got { color: var(--amber); }

/* Intro crawl */
.intro-screen { justify-content: center; }
.crawl { width: 860px; font-size: 18px; line-height: 1.55; }
.crawl p { margin: 0 0 14px; color: #d8d0bc; animation: fadein 0.6s ease; }
.crawl p:first-child { color: var(--amber); letter-spacing: 3px; font-size: 14px; }
.crawl .typing { color: #fff; }
.caret { animation: blink 0.8s infinite steps(1); color: var(--amber); }
@keyframes blink { 50% { opacity: 0; } }

/* Work orders */
.wo-screen { padding-top: 46px; }
.wo-title { font-size: 14px; letter-spacing: 5px; color: var(--dim); }
.monologue { margin: 16px 0 24px; max-width: 900px; text-align: center; font: italic 17px Georgia, "Times New Roman", serif; color: #e8dcc0; }
.monologue.glitch, .monologue.hollow { font-family: var(--mono); font-style: normal; color: var(--cyan); text-shadow: 0 0 8px rgba(80,240,255,0.5); }
.cards { display: flex; gap: 40px; }
.card {
  width: 430px; padding: 18px 22px; background: #e9e2cf; color: #1c1b17; position: relative;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6); transform: rotate(-0.6deg); transition: transform 0.15s, box-shadow 0.15s;
  background-image: repeating-linear-gradient(to bottom, transparent 0 27px, rgba(80,120,160,0.18) 27px 28px);
}
.card.hot { transform: rotate(0.8deg); }
.card.selected { transform: translateY(-10px) rotate(0); box-shadow: 0 0 0 3px var(--amber), 0 18px 40px rgba(0,0,0,0.7); }
.card.hot.selected { box-shadow: 0 0 0 3px var(--red), 0 18px 40px rgba(0,0,0,0.7); }
.wo-head { font-size: 10px; letter-spacing: 2px; color: #6a6450; }
.card h2 { margin: 6px 0 2px; font-size: 26px; letter-spacing: 2px; }
.card.hot h2 { color: #a3200f; }
.risk { font-size: 11px; font-weight: bold; color: #6a2a10; }
.card ul { padding-left: 18px; font-size: 13px; line-height: 1.5; }
.mutator { font-size: 12px; padding: 8px; border: 1px dashed #7a7058; margin: 8px 0; line-height: 1.4; }
.reward { font-size: 12px; font-weight: bold; color: #1f4d2a; }
.card.hot .reward { color: #7a1a0a; }
.card::after {
  content: "SIGNED"; position: absolute; right: 18px; bottom: 14px; font: 900 22px var(--mono); color: rgba(180,30,20,0);
  border: 3px solid rgba(180,30,20,0); padding: 0 6px; transform: rotate(-12deg); transition: all 0.2s;
}
.card.selected::after { color: rgba(180,30,20,0.55); border-color: rgba(180,30,20,0.55); }

/* Breakroom */
.break-screen { padding: 18px 26px 50px; background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.35) 30%, rgba(0,0,0,0.75)); }
.break-head { text-align: center; max-width: 1100px; }
.break-title { font-size: 13px; letter-spacing: 5px; color: var(--amber); }
.reflection { margin: 6px 0; font: italic 15px Georgia, serif; color: #e8dcc0; }
.reflection.glitch, .reflection.hollow { font-family: var(--mono); font-style: normal; color: var(--cyan); }
.summary { display: flex; gap: 16px; justify-content: center; font-size: 11px; color: var(--dim); margin-top: 4px; }
.shop { display: flex; gap: 16px; margin-top: 12px; width: 100%; flex: 1; min-height: 0; }
.shop-col, .shop-mid { background: rgba(8,10,12,0.95); border: 1px solid var(--steel); padding: 10px 12px; display: flex; flex-direction: column; }
.shop-col { width: 370px; }
.shop-mid { flex: 1; }
.shop h3 { margin: 0; font-size: 12px; letter-spacing: 2px; }
.shop-col.body h3 { color: var(--amber); }
.shop-col.voxel h3 { color: var(--cyan); }
.keys { font-size: 10px; color: var(--dim); margin: 4px 0 6px; }
.shop ul { list-style: none; margin: 0; padding: 0; overflow: hidden; flex: 1; }
.shop li { padding: 6px 8px; border: 1px solid transparent; margin-bottom: 4px; font-size: 11px; }
.shop li .row { display: flex; justify-content: space-between; font-weight: bold; }
.shop li .desc { color: #a8a090; margin-top: 2px; line-height: 1.3; }
.shop li .syn { color: var(--cyan); margin-top: 3px; }
.shop li.poor .cost { color: var(--red); }
.shop-col.body li.sel { border-color: var(--amber); background: rgba(255,207,112,0.08); }
.shop-col.voxel li.sel { border-color: var(--cyan); background: rgba(80,240,255,0.08); }
.ready { text-align: center; font-size: 12px; padding: 5px; border: 1px solid #444; color: var(--dim); margin-top: 6px; }
.ready.on { border-color: #60ff90; color: #60ff90; box-shadow: 0 0 12px rgba(96,255,144,0.3) inset; }
.scrap { font: bold 30px var(--mono); color: #e09a50; text-align: center; }
.scrap small { font-size: 11px; color: var(--dim); }
.stat { text-align: center; font-size: 11px; color: #c8c0ac; margin: 2px 0 8px; }
.owned { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-bottom: 8px; }
.chip { font-size: 9px; padding: 2px 6px; border: 1px solid #555; color: #c8c0ac; }
.chip.body { border-color: #8a6f30; } .chip.voxel { border-color: #2a8090; } .chip.none { opacity: 0.5; }
.synergies h4 { margin: 4px 0; font-size: 10px; letter-spacing: 2px; color: var(--dim); }
.synergy { font-size: 10px; color: #6a665c; padding: 4px 6px; border-left: 2px solid #333; margin-bottom: 4px; line-height: 1.3; }
.synergy small span.have { color: var(--ink); }
.synergy.on { color: var(--cyan); border-left-color: var(--cyan); background: rgba(80,240,255,0.06); }
.log { margin-top: auto; font-size: 10px; color: #c8c0ac; line-height: 1.45; border-top: 1px solid #2a2d30; padding-top: 6px; }

/* Endings */
.end-screen { justify-content: center; background: radial-gradient(ellipse at center, rgba(0,0,0,0.25), rgba(0,0,0,0.65)); }
.end-title { font: 900 48px var(--mono); letter-spacing: 8px; color: var(--ink); text-shadow: 0 0 20px rgba(255,220,160,0.3); }
.end-sub { margin-top: 6px; font-size: 13px; letter-spacing: 4px; color: var(--amber); }
.company .end-title, .ghost .end-title { color: var(--cyan); text-shadow: 0 0 18px rgba(80,240,255,0.5); }
.terminated .end-title { color: var(--red); }
.end-lines { width: 860px; margin-top: 26px; }
.end-lines p { font: italic 17px/1.5 Georgia, serif; color: #e8dcc0; margin: 0 0 10px; opacity: 0; animation: fadein 1.4s ease forwards; }
.company .end-lines p, .ghost .end-lines p:nth-child(2) { font-family: var(--mono); font-style: normal; font-size: 15px; }
.end-stats { display: flex; flex-direction: column; align-items: center; gap: 3px; margin-top: 14px; font-size: 11px; color: var(--dim); opacity: 0; animation: fadein 1.2s ease forwards; }
.pause-screen { justify-content: center; background: rgba(0,0,0,0.6); }

</style>
</head>
<body>
  <main id="stage" aria-label="Shift Zero game">
    <!-- World layer: tiles, lighting, particles (Canvas 2D) -->
    <canvas id="game" width="1280" height="720"></canvas>
    <!-- HUD layer: portrait, gauges, oscilloscope, watch -->
    <canvas id="ui" width="1280" height="720"></canvas>
    <!-- Diegetic DOM layer, authored at 1280×720 and scaled as one unit -->
    <div id="dom-layer">
      <div id="pager" class="idle" style="display:none" aria-live="polite">
        <div class="pager-body">
          <div class="pager-brand">GRIDCORP · ALPHA-7</div>
          <div class="pager-screen">
            <div id="pager-from">GRIDCORP PAGER</div>
            <div id="pager-text">NO NEW MESSAGES</div>
          </div>
          <div class="pager-buttons"><i></i><i></i><i></i></div>
        </div>
      </div>
      <div id="overlay"></div>
    </div>
    <!-- Post: CRT scanlines, film grain, vignette, phosphor flicker -->
    <div id="crt" aria-hidden="true"><div class="grain"></div><div class="scan"></div><div class="vignette"></div></div>
  </main>

      run.efficiency = Math.min(1.6, run.efficiency * 1.1);
      this.setAnchor(run.anchor - cost);
      this.surgeFx(1);
      if (this.body.downed) {
        this.body.revive(0.55);
        this.toast("OVERCLOCK REVIVE \u2014 the body stands back up", "#50f0ff");
      }
      this.circuit.forceOff(10);
      for (const a of this.anomalies) {
        if (!a.alive) continue;
        if (dist(a.x, a.y, this.body.x, this.body.y) < TILE * 9 || dist(a.x, a.y, this.voxel.x, this.voxel.y) < TILE * 6) {
          a.measuredT = 1;

        }
      }
      for (const d of this.devices) {

    surgeFx(k) {

    spawnAnomalyNear(kind, x, y, max, radius = TILE * 6) {
      if (this.anomalies.filter((a) => a.alive && a.kind === kind).length >= max) return;
      for (let i = 0; i < 20; i++) {
        const a = Math.random() * Math.PI * 2, r = radius * (0.5 + Math.random() * 0.5);
        const sx = x + Math.cos(a) * r, sy = y + Math.sin(a) * r;
        if (kind !== "phantom" && this.isSolidPx(sx, sy)) continue;
        if (dist(sx, sy, this.body.x, this.body.y) < TILE * 3) continue;
        const m = createAnomaly(kind, sx, sy);
        m.aggro = true;
        this.anomalies.push(m);
        this.particles.voxels(sx, sy, 16, { color: kind === "crawler" ? PC.ROT : PC.WHITE, burst: 60 });
        return;
      }
    }
    ejectBodyFrom(bulk) {
      const b = this.body;
      if (b.x + b.r < bulk.x0 || b.x - b.r > bulk.x1 || b.y + b.r < bulk.y0 || b.y - b.r > bulk.y1) return;
      if (bulk.orient === "v") b.x = Math.abs(b.x - bulk.x0) < Math.abs(b.x - bulk.x1) ? bulk.x0 - b.r - 1 : bulk.x1 + b.r + 1;
      else b.y = Math.abs(b.y - bulk.y0) < Math.abs(b.y - bulk.y1) ? bulk.y0 - b.r - 1 : bulk.y1 + b.r + 1;

    onCircuitEvent(type, data) {

        if (dev) {
          this.particles.sparks(dev.px, dev.py, 20);

    onMemoryShard(dev) {

    }
    summary() {
      const run = this.run;
      const depth = run.depth;
      const timeBonus = this.meltdownMax > 0 && this.meltdown / this.meltdownMax > 0.5 ? 1.25 : 1;
      const basePay = 30 + depth * 14;
      const pay = Math.round(basePay * run.efficiency * timeBonus * (run.workOrder === "hot" ? 2 : 1) * (run.mutator === "overtime" ? 1.5 : 1));
      return { depth, pay, efficiency: run.efficiency, timeBonus, time: this.time, timeLeft: this.meltdown };
    }
    objective() {
      if (this.boss) {
        const b2 = this.boss;
        if (b2.defeated) return "It's over.";
        if (b2.phase === 1) return `De-energize all 3 bushings: throw + LOTO breakers 52-TA/TB/TC (dead 3s each) \xB7 ${b2.failed.size}/3`;
        if (b2.phase === 2) return "VOXEL: hold NEUTRAL GROUND (north-west) \xB7 BODY: strike the exposed coil with the Hot Stick";
        return `Throw the MAIN DISCONNECT (north) while grounded \xB7 ${Math.ceil(b2.meltdown)}s`;
      }
      const b = this.body;
      const tx = Math.floor(b.x / TILE), ty = Math.floor(b.y / TILE);
      const r = this.exitRoom;
      if (r && tx > r.x0 && tx < r.x0 + 14 && ty > r.y0 && ty < r.y0 + 10) return "Ride the freight elevator down";
      const bulk = this.devices.find((d) => d instanceof Bulkhead);
      const live = this.hazardLights.filter((g) => this.circuit.isEnergized(g.node)).length;
      const parts = [];
      if (bulk && bulk.open < 1) parts.push("Elevator bulkhead is dead \u2014 VOXEL: hold a living jumper on the blown F-200A fuse");
      else parts.push("Bulkhead open \u2014 get the Body through!");
      if (live) parts.push(`${live} live water hazard${live > 1 ? "s" : ""} on site`);
      return parts.join(" \xB7 ");
    }
    // ------------------------------------------------------------------ update
    update(dt, intents) {
      if (this.exitT > 0) {
        this.exitT -= dt;
        this.time += dt;
        this.particles.update(dt, this);
        this.updateTimers(dt);
        if (this.exitKind === "elevator") this.camera.addTrauma(dt * 0.4);
        if (this.exitT <= 0) {
          this.run.hp = this.body.hp;
          if (this.exitKind === "boss") this.game.onBossDefeated(this.bossHow);
          else this.game.onFloorComplete(this.summary());
        }
        return;
      }
      this.time += dt;
      this.overclockCd = Math.max(0, this.overclockCd - dt);
      this.anchorToastCd = Math.max(0, this.anchorToastCd - dt);
      this.circuit.update(dt);
      this.computeTargets();
      this.body.update(dt, intents.body, this);
      this.voxel.update(dt, intents.voxel, this);
      for (const d of this.devices) d.update(dt, this);
      this.flowT -= dt;
      if (this.flowT <= 0) {
        this.flowT = 0.35;
        this.recomputeFlow();
      }
      for (const a of this.anomalies) if (a.alive) a.update(dt, this);
      this.anomalies = this.anomalies.filter((a) => a.alive);
      if (this.boss) this.boss.update(dt, this);
      for (const p of this.pads) p.t -= dt;
      this.pads = this.pads.filter((p) => p.t > 0);
      for (const d of this.decoys) d.t -= dt;
      this.decoys = this.decoys.filter((d) => d.t > 0);
      this.updateHazards(dt);
      this.updateLasso(dt);
      this.updateStress(dt);
      this.updateMeltdown(dt);
      this.updateTimers(dt);
      this.particles.update(dt, this);
      const b = this.body;
      const fpower = this.run.anchor < 30 && Math.random() < 0.05 ? 0.3 : 1;
      this.flashlight = {
        x: b.x + Math.cos(b.facing) * 6,
        y: b.y - 10 + Math.sin(b.facing) * 4,
        angle: b.facing,
        spread: 0.44,
        range: 330 * this.lightScale,
        power: fpower
      };
      const targets = [{ x: b.x, y: b.y - 10, weight: 1.3 }];
      if (this.voxel.desyncT <= 0) targets.push({ x: this.voxel.x, y: this.voxel.y, weight: 0.8 });
      if (this.boss && !this.boss.defeated) targets.push({ x: this.boss.x, y: this.boss.y, weight: 0.25 });
      this.camera.frame(targets, dt);
      let crackle = 0;
      for (const g of this.hazardLights) {
        if (!this.circuit.isEnergized(g.node)) continue;
        crackle = Math.max(crackle, 1 - dist(g.x, g.y, b.x, b.y) / (TILE * 7));
      }
      for (const d of this.devices) if (d.active && d.axp !== void 0) crackle = Math.max(crackle, 1 - dist(d.px, d.py, b.x, b.y) / (TILE * 6));
      if (this.voxel.jumper) crackle = Math.max(crackle, 0.7);
      if (this.boss && this.boss.beamsActive(this)) crackle = Math.max(crackle, 0.5);
      audio.setCrackle(clamp(crackle, 0, 1));
      audio.setHum(clamp(this.circuit.liveLoadCount() / 8, 0, 1), this.circuit.stress);
      if (b.downed && b.downedT <= 0 && !this.terminated) {
        this.terminated = true;
        this.run.hp = 0;
        this.game.onShiftTerminated();
      }
    }
    updateTimers(dt) {
      this.flash = Math.max(0, this.flash - dt * 2.2);
      for (const e of this.effects) e.t += dt;
      this.effects = this.effects.filter((e) => e.t < e.max);
      for (const t of this.toasts) t.t += dt;
      this.toasts = this.toasts.filter((t) => t.t < t.max);
      if (this.bigText) {
        this.bigText.t += dt;
        if (this.bigText.t > this.bigText.max) this.bigText = null;
      }
    }
    updateHazards(dt) {
      const b = this.body;
      if (b.downed) return;
      const tx = Math.floor(b.x / TILE), ty = Math.floor((b.y + 6) / TILE);
      if (this.isWaterLive(tx, ty) && !b.isPhasing(this)) {
        if (this.outOfWaterT > 1) this.markShortcut();
        this.outOfWaterT = 0;
        this.liveWaterT += dt;
        this.hurtBody(40 * dt, b.x, b.y, "water");
        this.camera.addTrauma(dt * 1.6);
        if (Math.random() < dt * 30) this.particles.sparks(b.x + (Math.random() - 0.5) * 20, b.y + 8, 2, { speed: 140, up: 160, color: PC.WHITE });
        if (Math.random() < dt * 8) this.effects.push({ type: "bolt", pts: lightningPath(b.x, b.y - 20, b.x + (Math.random() - 0.5) * 50, b.y + 10, 5, 8), t: 0, max: 0.08, color: "rgba(200,230,255,0.9)" });
        if (Math.random() < dt * 4) audio.spark(0.6);
      } else {
        this.outOfWaterT += dt;
      }
    }
    updateLasso(dt) {
      const b = this.body, v = this.voxel;

          if (Math.random() < dt * 20) this.particles.sparks(a.x, a.y, 3, { color: PC.CYAN, speed: 160 });
        }
      }
    }
    updateStress(dt) {
      if (this.isBoss) return;
      this.stressSpawnT -= dt;
      if (this.circuit.stress > 0.35 && this.stressSpawnT <= 0) {
        this.stressSpawnT = 13;
        const pl = this.circuit.phaseLoad;
        const low = ["A", "B", "C"].reduce((m, p) => pl[p] < pl[m] ? p : m, "A");
        this.narrative.event("imbalance", { phase: low }, this.run.anchor);
        this.spawnAnomalyNear("phantom", this.body.x, this.body.y, 3, TILE * 8);
        this.toast("PHASE IMBALANCE \u2014 harmonics manifest. (Balance your lockouts across A/B/C)", "#9dffd0", 4);
      }
    }
    updateMeltdown(dt) {
      if (this.isBoss || this.meltdownMax <= 0) return;
      this.meltdown = Math.max(0, this.meltdown - dt);
      if (!this.warned && this.meltdown <= 30) {
        this.warned = true;
        this.narrative.event("meltdownWarn", { priority: true }, this.run.anchor);
      }
      if (this.meltdown <= 0) {
        this.meltdownTick -= dt;
        if (this.meltdownTick <= 0) {

            this.meltedOnce = true;
            this.narrative.event("meltdown", { priority: true }, this.run.anchor);
          }
          this.meltdownTick = 2;
          this.hurtBody(6, this.body.x, this.body.y, "flash");
          this.drainAnchor(1, "The load spike hums through your teeth. The Timex skips a beat.");
          this.camera.addTrauma(0.3);
          if (Math.random() < 0.3) this.spawnAnomalyNear("hound", this.body.x, this.body.y, 6, TILE * 8);
        }
      }
    }
    // ------------------------------------------------------------------ rendering
    buildStaticLayer() {
      const W2 = this.w, H2 = this.h;
      const c = document.createElement("canvas");
      c.width = W2 * TILE;
      c.height = H2 * TILE;
      const g = c.getContext("2d");
      g.fillStyle = "#050607";
      g.fillRect(0, 0, c.width, c.height);
      const seed = this.level.seed & 65535;
      const floorLike = (t) => t === T.FLOOR || t === T.FENCE;
      for (let y = 0; y < H2; y++) {
        for (let x = 0; x < W2; x++) {
          const t = this.tiles[this.idx(x, y)];
          const px = x * TILE, py = y * TILE;
          if (floorLike(t) || t === T.CABINET) {
            const n = noise2(x * 0.35, y * 0.35, seed);
            const v = 38 + n * 14 + hashNoise(x, y, seed) * 5;
            g.fillStyle = `rgb(${v | 0},${v + 3 | 0},${v + 6 | 0})`;
            g.fillRect(px, py, TILE, TILE);
            for (let k = 0; k < 10; k++) {
              const h2 = hashNoise(x * 13 + k, y * 7 - k, seed);
              g.fillStyle = h2 > 0.5 ? "rgba(255,255,255,0.035)" : "rgba(0,0,0,0.12)";
              g.fillRect(px + hashNoise(k, x, y) * 31, py + hashNoise(y, k, x) * 31, 1, 1);
            }
            if (x % 4 === 0) {
              g.fillStyle = "rgba(0,0,0,0.25)";
              g.fillRect(px, py, 1, TILE);
            }
            if (y % 4 === 0) {
              g.fillStyle = "rgba(0,0,0,0.25)";
              g.fillRect(px, py, TILE, 1);
            }
            const h = hashNoise(x, y, seed + 9);
            if (h > 0.965) {
              g.fillStyle = "rgba(12,10,6,0.45)";
              g.beginPath();
              g.ellipse(px + 16, py + 16, 10 + h * 8, 5 + h * 4, h * 6, 0, Math.PI * 2);
              g.fill();
            } else if (h < 0.025) {
              g.strokeStyle = "rgba(0,0,0,0.4)";
              g.lineWidth = 1;
              g.beginPath();
              g.moveTo(px + 2, py + 5);
              g.lineTo(px + 12, py + 14);
              g.lineTo(px + 18, py + 12);
              g.lineTo(px + 30, py + 26);
              g.stroke();
            } else if (h > 0.93 && h < 0.94) {
              g.fillStyle = "#1c1e20";
              g.fillRect(px + 6, py + 6, 20, 20);
              g.fillStyle = "#2e3236";
              for (let k = 0; k < 5; k++) g.fillRect(px + 8 + k * 4, py + 7, 2, 18);
            }
          } else if (t === T.WALL) {
            const nearFloor = DIRS.some((d) => floorLike(this.tileAt(x + d.dx, y + d.dy))) || floorLike(this.tileAt(x + 1, y + 1)) || floorLike(this.tileAt(x - 1, y - 1)) || floorLike(this.tileAt(x + 1, y - 1)) || floorLike(this.tileAt(x - 1, y + 1));
            if (!nearFloor) continue;
            g.fillStyle = "#16181b";
            g.fillRect(px, py, TILE, TILE);
            g.fillStyle = "rgba(255,255,255,0.05)";
            g.fillRect(px, py, TILE, 2);
            if (floorLike(this.tileAt(x, y + 1))) {
              const grad = g.createLinearGradient(0, py + 14, 0, py + TILE);
              grad.addColorStop(0, "#40454b");
              grad.addColorStop(1, "#2a2d31");
              g.fillStyle = grad;
              g.fillRect(px, py + 14, TILE, TILE - 14);
              g.fillStyle = "rgba(0,0,0,0.35)";
              g.fillRect(px, py + 14, TILE, 2);
              if (hashNoise(x, y, seed + 3) > 0.7) {
                g.fillStyle = "rgba(120,60,20,0.35)";
                g.fillRect(px + hashNoise(x, y, 4) * 26, py + 16, 2, 8 + hashNoise(y, x, 5) * 8);
              }
              if (x % 6 === 0) {
                g.fillStyle = "#5a5f66";
                g.fillRect(px, py + 18, TILE, 3);
              }
            }
          }
          if (t === T.CABINET) {
            const right = this.tileAt(x + 1, y) === T.CABINET, below = this.tileAt(x, y + 1) === T.CABINET;
            const left = this.tileAt(x - 1, y) === T.CABINET, above = this.tileAt(x, y - 1) === T.CABINET;
            g.fillStyle = "rgba(0,0,0,0.45)";
            g.fillRect(px + 3, py + 6, TILE, TILE);
            g.fillStyle = "#4b5258";
            g.fillRect(px + (left ? 0 : 2), py + (above ? 0 : 1), TILE - (left ? 0 : 2) - (right ? 0 : 2), TILE - (above ? 0 : 1) - (below ? 0 : 0));
            g.fillStyle = "#5e666d";
            g.fillRect(px + (left ? 0 : 2), py + (above ? 0 : 1), TILE - (left ? 0 : 2) - (right ? 0 : 2), 10);
            if (!below) {
              g.fillStyle = "#383d42";
              g.fillRect(px + (left ? 0 : 2), py + 22, TILE - (left ? 0 : 2) - (right ? 0 : 2), 10);
              for (let k = 0; k < 4; k++) {
                g.fillStyle = "#25292d";
                g.fillRect(px + 6 + k * 5, py + 25, 3, 1);
              }
            }
            if (!left) {
              g.fillStyle = "#e0c020";
              g.beginPath();
              g.moveTo(px + 9, py + 12);
              g.lineTo(px + 15, py + 21);
              g.lineTo(px + 3, py + 21);
              g.closePath();
              g.fill();
              g.fillStyle = "#111";
              g.fillRect(px + 8.5, py + 15, 1, 4);
            }
            g.fillStyle = "#9aa2a8";
            g.fillRect(px + TILE - 7, py + 14, 2, 5);
          }
        }
      }
      g.strokeStyle = "rgba(70,110,120,0.55)";
      g.lineWidth = 3;
      g.beginPath();
      for (let y = 0; y < H2; y++) for (let x = 0; x < W2; x++) {
        const m = this.conduit[this.idx(x, y)];
        if (!m) continue;
        const cx = (x + 0.5) * TILE, cy = (y + 0.5) * TILE;
        if (m & 2) {
          g.moveTo(cx, cy);
          g.lineTo(cx + TILE, cy);
        }
        if (m & 4) {
          g.moveTo(cx, cy);
          g.lineTo(cx, cy + TILE);
        }
      }
      g.stroke();
      g.font = 'bold 14px "IBM Plex Mono", ui-monospace, monospace';
      g.textAlign = "center";
      for (const r of this.level.rooms) {
        if (this.isBoss) break;
        g.strokeStyle = "rgba(210,170,40,0.18)";
        g.lineWidth = 2;
        g.strokeRect((r.x0 + 1.5) * TILE, (r.y0 + 1.5) * TILE, 12 * TILE, 8 * TILE);
        if (r.isStart) {
          g.fillStyle = "rgba(220,200,150,0.12)";
          g.fillText(`SUBSTATION ZERO \xB7 DEPTH ${this.run.depth}`, (r.cx + 0.5) * TILE, (r.cy - 2) * TILE);
        } else if (hashNoise(r.gx, r.gy, seed) > 0.6) {
          g.fillStyle = "rgba(200,40,30,0.13)";
          g.fillText("DANGER \xB7 480V", (r.cx + 0.5) * TILE, (r.cy + 3.5) * TILE);
        }
      }
      if (this.isBoss) {
        g.fillStyle = "rgba(200,40,30,0.15)";
        g.fillText("DANGER \xB7 13,800 VOLTS \xB7 AUTHORISED PERSONNEL ONLY", (this.level.center.x + 0.5) * TILE, (this.level.center.y + 8) * TILE);
      }
      return c;
    }
    render(ctx, t) {

        const sun = ctx.createRadialGradient(1e3, 520, 10, 1e3, 520, 500 * k + 100);
        sun.addColorStop(0, "rgba(255,200,140,0.5)");
        sun.addColorStop(1, "rgba(255,160,100,0)");

        ctx.fillRect(0, 0, this.w, this.h);

        this.dummy.moving = true;

        ctx.restore();
        if (id === "ghost") {
          for (let i = 0; i < 30; i++) {
            const a = hashNoise(i, Math.floor(t * 6), 1);

            ctx.fillRect(430 + hashNoise(i, 2, 2) * 400, 440 + hashNoise(i, 3, 3) * 80 + Math.sin(t + i) * 4, 3, 3);

    }
  };

  // src/main.js
  var W = 1280;
  var H = 720;
  var STEP = 1 / 60;
  var META_KEY = "shiftzero.meta.v1";
  function loadMeta() {
    try {
      const m = JSON.parse(localStorage.getItem(META_KEY));
      if (m && Array.isArray(m.endings)) return m;
    } catch {
    }
    return { endings: [], runs: 0 };
  }
  function saveMeta(m) {
    try {
      localStorage.setItem(META_KEY, JSON.stringify(m));
    } catch {
    }

  var fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  var Game = class {
    constructor() {

      this.ctx = this.canvas.getContext("2d", { alpha: false });
      this.uiCanvas = document.getElementById("ui");
      this.canvas.width = this.uiCanvas.width = W;
      this.canvas.height = this.uiCanvas.height = H;
      this.input = new Input(window);
      this.camera = new Camera(W, H);
      this.particles = new ParticlePool(3500);
      this.lighting = new Lighting(W, H);
      this.hud = new HUD(this.uiCanvas, document.getElementById("pager"));
      this.screens = new Screens(document.getElementById("overlay"));
      this.backdrops = new Backdrops(W, H);
      this.narrative = new Narrative();
      this.meta = loadMeta();
      this.swapped = false;
      this.paused = false;
      this.world = null;
      this.run = null;
      this.t = 0;
      this.stateT = 0;
      this.acc = 0;
      this.last = performance.now();
      this.intents = { body: {}, voxel: {} };
      const qs = new URLSearchParams(location.search);
      this.forcedSeed = qs.has("seed") ? Number(qs.get("seed")) >>> 0 : null;
      this.debug = qs.has("debug");
      this.setState("title");
      window.addEventListener("resize", () => this.fit());
      this.fit();
      this.input.onPadChange = (n, added) => {
        if (this.world) this.world.toast(added ? `CONTROLLER CONNECTED \xB7 ${n} active` : `CONTROLLER DISCONNECTED \xB7 ${n} active`, "#50f0ff");

    fit() {

      stage.style.height = `${Math.floor(H * s)}px`;
      stage.style.setProperty("--ui-scale", s);
    }
    setState(name) {
      this.state = name;
      this.stateT = 0;
      this.paused = false;
      this.hud.showPager(name === "playing");
      audio.setBreakroom(name === "breakroom");
      if (name !== "playing") this.hud.clear();
      if (name === "intro") {
        this.introIndex = 0;
        this.introChars = 0;
      }
      if (name === "workorder") {
        this.cards = this.makeWorkOrders();
        this.cardSel = 0;
      }
      if (name === "playing") this.screens.hide();
    }
    // ------------------------------------------------------------------ run lifecycle
    newRun() {
      const seed = this.forcedSeed ?? (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;

        seed,
        rng: new RNG(seed),
        depth: 1,
        anchor: 100,
        hp: 100,
        rpg: new RPGSystem(),
        workOrder: "clean",
        mutator: null,
        mutatorName: "",
        efficiency: 1,
        scrapEarned: 0,
        totalPay: 0,
        lotoCount: 0,
        shortcuts: 0,
        verified: 0,
        overclocks: 0,
        downs: 0,
        ciphers: 0,

        memoryShards: 0,
        burnedAll: false,
        floorsCleared: 0

      this.swapped = false;

      audio.setIntensity(0);

    }
    makeWorkOrders() {
      const run = this.run, rng = run.rng, d = run.depth;
      const muts = rng.shuffle(Object.keys(MUTATORS));
      return [
        {
          kind: "clean",
          number: `${d}${rng.int(100, 999)}-C`,
          title: "CLEAN MAINTENANCE",
          risk: "RISK: STANDARD \xB7 PAY: BASE",
          lines: [`Planned outage window: ${fmt(220 - d * 10)}`, "Standard hazards. Fewer Arc Hounds on patrol.", "Lock it. Tag it. Try it."],
          mutator: muts[0],
          reward: "REWARD: ANCHOR RESTORATION +15 \xB7 free defensive gear"
        },
        {
          kind: "hot",
          number: `${d}${rng.int(100, 999)}-H`,
          title: "HOT-WORK EMERGENCY",
          risk: "RISK: HIGH \xB7 PAY: DOUBLE",
          lines: [`Grid stays live. Load spike in ${fmt(150 - d * 8)}`, "Arc Hounds patrol in packs. Extra capacitor banks.", "Sign the waiver. Don't read it."],
          mutator: muts[1],
          reward: "REWARD: EXPERIMENTAL PROTOTYPE \xB7 2\xD7 scrap"

      ];
    }
    startFloor() {
      const run = this.run;
      run.efficiency = 1;
      run.mutatorName = run.mutator ? MUTATORS[run.mutator].name : "";
      const level = generateLevel({ seed: run.seed + run.depth * 1013 >>> 0, depth: run.depth, workOrder: run.workOrder, mutator: run.mutator });
      this.world = new World(this, level);

      this.setState("playing");
    }
    startBoss() {
      const run = this.run;
      run.workOrder = "final";
      run.mutator = null;
      run.mutatorName = "";
      run.efficiency = Math.max(run.efficiency, 1);
      const level = generateLevel({ seed: run.seed, depth: 5 });
      this.world = new World(this, level);
      this.narrative.clear();
      this.narrative.event("bossStart", { priority: true }, run.anchor);
      this.world.bigText = { title: "THE MAIN TIE TRANSFORMER", text: "Thirteen thousand eight hundred volts. The thing that ate the shift. Lock out all three phases.", t: 0, max: 6, color: "#ff9040", icon: "key" };

    }
    onFloorComplete(summary) {
      const run = this.run, rpg = run.rpg;
      rpg.scrap += summary.pay;
      run.totalPay += summary.pay;
      run.floorsCleared++;
      const log = [`Shift pay +${summary.pay} Cu \xB7 efficiency ${Math.round(summary.efficiency * 100)}%${summary.timeBonus > 1 ? " \xB7 on-time bonus" : ""}`];
      const lostBefore = memoriesLost(run.anchor);
      if (run.workOrder === "clean") {
        const before = run.anchor;
        run.anchor = Math.min(100, run.anchor + 15);
        log.push(`Anchor restored +${run.anchor - before}% \u2014 you did it right, and some of you came back`);
        const g = rpg.rollDefensive(run.rng);
        if (g) {
          rpg.grant(g);
          log.push(`Defensive gear issued: ${ITEMS[g].name}`);
        }
      } else {
        const p = rpg.rollPrototype(run.rng);
        if (p) {
          rpg.grant(p);
          log.push(`Experimental prototype acquired: ${ITEMS[p].name}`);
        } else {
          rpg.scrap += 40;
          log.push("No prototypes left in the crate: +40 Cu hazard bonus");
        }
      }
      const lostAfter = memoriesLost(run.anchor);
      if (lostAfter < lostBefore) log.push(`MEMORY RECOVERED: ${MEMORIES[lostAfter].title.replace("{WIFE}", "Mara").replace("{KID}", "Tess")}`);
      const maxHp = rpg.stats().maxHp;
      run.hp = Math.min(maxHp, run.hp + 15);
      log.push("Five minutes on the bench: +15 Body");
      audio.setMood(run.anchor);
      this.world = null;
      const shop = rpg.rollShop(run.rng);
      this.br = {
        bodyList: [...shop.body, ...shop.shared],
        voxelList: shop.voxel,
        selB: 0,
        selV: 0,
        readyB: false,
        readyV: false,
        log,
        reflection: this.narrative.breakroom(run.depth, run.anchor),
        tier: tier(run.anchor),
        summary: [`Depth ${run.depth} cleared`, `LOTO locks ${run.lotoCount}`, `Corners cut ${run.shortcuts}`, `Ciphers ${run.ciphers}/4`]
      };
      this.setState("breakroom");
    }
    onShiftTerminated() {
      this.terminateT = 1.8;
    }
    onBossDefeated() {
      const id = determineEnding(this.run);
      this.endingId = id;
      if (!this.meta.endings.includes(id)) this.meta.endings.push(id);
      saveMeta(this.meta);
      audio.setIntensity(0);
      this.world = null;
      this.setState("ending");
    }
    endingStats() {
      const r = this.run;
      return [
        `Anchor ${r.anchor}% \xB7 memories kept ${5 - memoriesLost(r.anchor)}/5`,
        `LOTO locks hung ${r.lotoCount} \xB7 verified dead ${r.verified} \xB7 corners cut ${r.shortcuts}`,
        `Overclocks ${r.overclocks} \xB7 ciphers ${r.ciphers}/4 \xB7 copper earned ${r.scrapEarned + r.totalPay}`,
        `Final efficiency bonus (corporate's favourite number): ${Math.round(r.efficiency * 100)}%`
      ];
    }
    // ------------------------------------------------------------------ loop
    frame(now) {
      const dt = Math.min(0.1, (now - this.last) / 1e3);
      this.last = now;
      this.t += dt;
      this.input.pollGamepads();
      this.rumbleT = (this.rumbleT || 0) - dt;
      if (this.camera.trauma > 0.25 && this.rumbleT <= 0 && this.input.pads.length) {
        this.rumbleT = 0.1;
        this.input.rumble(this.camera.trauma * this.camera.trauma, 120);
      }
      this.camera.update(dt);
      if (this.camera.hitStopT > 0) {
        this.camera.hitStopT -= dt;
        this.acc = 0;
        this.globalKeys();
      } else {
        this.acc += dt;
        let steps = 0;
        while (this.acc >= STEP && steps < 6) {
          this.update(STEP);
          this.input.consume();
          this.acc -= STEP;
          steps++;

        if (steps >= 6) this.acc = 0;
      }
      this.render(dt);
      audio.update(dt);
      requestAnimationFrame((n) => this.frame(n));
    }
    globalKeys() {

        audio.setMuted(!audio.muted);
      }
    }
    confirm() {

    }
    update(dt) {
      this.stateT += dt;
      this.globalKeys();
      const inp = this.input;
      switch (this.state) {
        case "title":
          if (this.confirm()) {
            audio.init();
            audio.uiSelect();
            this.newRun();
            this.setState("intro");
          }
          break;
        case "intro": {
          const line = INTRO[this.introIndex] || "";
          this.introChars += dt * 42;
          if (inp.wasPressed("Escape")) {
            this.setState("workorder");
            break;
          }
          if (this.confirm()) {
            audio.uiMove();
            if (this.introChars < line.length) this.introChars = line.length;
            else {
              this.introIndex++;
              this.introChars = 0;
            }
          }
          if (this.introIndex >= INTRO.length) this.setState("workorder");
          break;
        }
        case "workorder":
          if (inp.anyPressed("KeyA", "ArrowLeft", "KeyD", "ArrowRight")) {
            this.cardSel = 1 - this.cardSel;
            audio.uiMove();
          }
          if (this.stateT > 0.3 && this.confirm()) {
            const c = this.cards[this.cardSel];
            this.run.workOrder = c.kind;
            this.run.mutator = c.mutator;
            if (c.kind === "hot") this.run.shortcuts += 1;
            audio.uiSelect();
            this.startFloor();
          }
          break;
        case "playing":
          this.updatePlaying(dt);
          break;
        case "breakroom":
          this.updateBreakroom();
          break;
        case "ending":
        case "terminated":
          if (this.stateT > 3 && this.confirm()) {
            audio.uiSelect();
            this.setState("title");
          }
          break;
      }
    }
    updatePlaying(dt) {
      const inp = this.input;
      if (inp.wasPressed("Escape")) {
        this.paused = !this.paused;
        audio.uiMove();
      }
      if (this.paused) {
        if (inp.wasPressed("KeyR")) {
          this.world = null;
          this.setState("title");
        }
        return;
      }
      if (inp.wasPressed("Tab")) {
        if (this.swapped && this.world) this.world.voxel.latch(this.world);
        this.swapped = !this.swapped;
        audio.uiMove();
        if (this.world) this.world.toast(this.swapped ? "SOLO-SWAP: P1 keys now drive the VOXEL" : "SOLO-SWAP: P1 keys back on the BODY", "#50f0ff");
      }
      if (this.terminateT !== void 0 && this.terminateT > 0) {
        this.terminateT -= dt;
        if (this.terminateT <= 0) {
          this.terminateT = void 0;
          this.endingId = "terminated";
          this.world = null;
          this.setState("terminated");

        }
      }
      this.intents = this.input.readIntents(this.swapped);
      if (this.world) {
        this.world.update(dt, this.intents);
        const started = this.narrative.update(dt, this.run.anchor);
        this.hud.updatePager(this.narrative, dt, started);
      }
    }
    updateBreakroom() {
      const inp = this.input, br = this.br;
      if (inp.wasPressed("KeyW")) {
        br.selB = (br.selB + br.bodyList.length - 1) % br.bodyList.length;
        audio.uiMove();
      }
      if (inp.wasPressed("KeyS")) {
        br.selB = (br.selB + 1) % br.bodyList.length;
        audio.uiMove();
      }
      if (inp.wasPressed("ArrowUp") && br.voxelList.length) {
        br.selV = (br.selV + br.voxelList.length - 1) % br.voxelList.length;
        audio.uiMove();
      }
      if (inp.wasPressed("ArrowDown") && br.voxelList.length) {
        br.selV = (br.selV + 1) % br.voxelList.length;
        audio.uiMove();
      }
      if (this.stateT > 0.4) {
        if (inp.wasPressed("Space")) this.buy(br.bodyList, "selB");
        if (inp.anyPressed("Enter", "NumpadEnter")) this.buy(br.voxelList, "selV");
        if (inp.wasPressed("ShiftLeft")) {
          br.readyB = !br.readyB;
          audio.uiMove();
        }
        if (inp.wasPressed("ShiftRight")) {
          br.readyV = !br.readyV;
          audio.uiMove();
        }
        if (inp.wasPressed("Tab")) {
          br.readyB = br.readyV = true;
        }
      }
      if (br.readyB && br.readyV) {
        audio.uiSelect();
        this.run.depth++;
        if (this.run.depth >= 5) this.startBoss();
        else this.setState("workorder");
      }
    }
    buy(list, selKey) {
      const br = this.br, run = this.run, rpg = run.rpg;
      const id = list[br[selKey]];
      if (!id) return;
      const before = new Set(rpg.activeSynergies().map((s) => s.id));
      if (!rpg.buy(id)) {
        audio.deny();
        br.log.unshift(rpg.has(id) ? "Already owned." : `Not enough copper for ${ITEMS[id].name}.`);
        return;
      }
      audio.uiSelect();
      const maxHp = rpg.stats().maxHp;
      if (id === "coffee") run.hp = Math.min(maxHp, run.hp + 35);
      if (id === "burrito") run.hp = maxHp;
      br.log.unshift(`Bought ${ITEMS[id].name}.`);
      if (ITEMS[id].kind !== "consumable") {
        list.splice(br[selKey], 1);
        br[selKey] = Math.max(0, Math.min(br[selKey], list.length - 1));
      }
      for (const s of rpg.activeSynergies()) {
        if (!before.has(s.id)) {
          audio.synergy();
          br.log.unshift(`\u26A1 DUO-CIRCUIT SYNERGY ONLINE: ${s.name}`);
        }
      }
      br.log.length = Math.min(br.log.length, 7);
    }
    // ------------------------------------------------------------------ render
    render(dt) {
      const ctx = this.ctx, t = this.t;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      switch (this.state) {
        case "title":
          this.backdrops.title(ctx, t, dt);
          this.screens.title(this.meta, t, this.input.pads.length);
          break;
        case "intro":
          this.backdrops.intro(ctx, t, dt, this.introIndex);
          this.screens.intro(INTRO, this.introIndex, Math.floor(this.introChars));
          break;
        case "workorder": {
          this.backdrops.blueprint(ctx, t);
          const a = this.run.anchor;
          this.screens.workOrders(this.run.depth, this.cards, this.cardSel, this.narrative.floorLine(this.run.depth, a), tier(a));
          break;
        }
        case "playing":
          if (this.world) {
            this.world.render(ctx, t);
            this.postFx(ctx, t);
            this.hud.render(this, this.world, dt, t);
          }
          if (this.paused) this.screens.pause();
          else this.screens.hide();
          break;
        case "breakroom": {
          const run = this.run;
          this.backdrops.breakroom(ctx, t, dt, run.anchor);
          const stats = run.rpg.stats();
          this.screens.breakroom({ ...this.br, rpg: run.rpg, depth: run.depth, hp: run.hp, maxHp: stats.maxHp, anchor: run.anchor, locks: stats.padlocks });
          break;
        }
        case "ending":
        case "terminated": {
          const id = this.endingId;
          this.backdrops.ending(ctx, this.stateT, dt, id);
          const e = { id, ...this.narrative.ending(id, this.run.anchor) };
          this.screens.ending(e, this.endingStats(), this.stateT > 3);
          break;
        }
      }
    }
    /** Low-Anchor glitch: horizontal slices of the frame tear sideways. */
    postFx(ctx, t) {
      const a = this.run.anchor;
      if (a >= 40) return;
      const amt = (1 - a / 40) * 0.25;
      const tick = Math.floor(t * 20);
      if (hashNoise(tick, 0, 11) > amt) return;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      for (let i = 0; i < 3; i++) {
        const y = Math.floor(hashNoise(tick, i, 12) * H);
        const h = 4 + Math.floor(hashNoise(tick, i, 13) * 30);
        const dx = Math.round((hashNoise(tick, i, 14) - 0.5) * 40);
        ctx.drawImage(this.canvas, 0, y, W, h, dx, y, W, h);
      }
      ctx.fillStyle = "rgba(80,240,255,0.04)";
      ctx.fillRect(0, 0, W, H);
    }
  };
  window.addEventListener("DOMContentLoaded", () => new Game());
})();
