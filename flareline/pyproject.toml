[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flareline"
version = "0.1.0"
description = "Tube bend and 37° flare design aid (offline desktop tool)"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]
# versions the GUI was built and tested with
gui = ["PySide6==6.12.0", "pyvista==0.49.1", "pyvistaqt==0.13.1", "vtk==9.7.1"]

[project.gui-scripts]
flareline = "flareline.app.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flareline.data" = ["defaults/*.json"]
"flareline.samples" = ["*.flareline.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
