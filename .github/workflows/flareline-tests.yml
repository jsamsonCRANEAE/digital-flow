name: FlareLine tests

on:
  push:
    paths: ["flareline/**", ".github/workflows/flareline-tests.yml"]
  pull_request:
    paths: ["flareline/**", ".github/workflows/flareline-tests.yml"]

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: flareline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[test]
      - run: pip install -e .[gui]
        if: matrix.os == 'windows-latest'
      - run: pytest --report=TEST_REPORT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.os }}
          path: flareline/TEST_REPORT.md
