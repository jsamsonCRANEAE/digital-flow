    const key = kind + ':' + (kind === 'hit' || kind === 'step' ? Math.round(k * 4) : 0) + (kind === 'step' ? ':' + rng.int(3) : '');
    let buf = this.sfxCache.get(key);
    if (!buf) { const vs = sfxVoices(kind, k), n = (SR * 1.2) | 0, pcm = new Float32Array(n); let last = 0;
      for (let i = 0; i < n; i++) { let s = 0; for (const v of vs) { if (v.t < 0) { v.t += 1 / SR; continue; } if (!v.finished) s += v.sample(1 / SR); }
        pcm[i] = s; if (Math.abs(s) > 1e-4) last = i; }
      buf = this.ctx.createBuffer(1, last + 64, SR); buf.getChannelData(0).set(pcm.subarray(0, last + 64)); this.sfxCache.set(key, buf); }
    const src = this.ctx.createBufferSource(); src.buffer = buf; src.connect(this.sfxGain); src.start();
  },
  crowd(level) { if (!this.crowdGain) return; this.crowdGain.gain.setTargetAtTime(clamp(level, 0, 1) * 0.5, this.ctx.currentTime, 0.4); },
};

// ==== 03-render.js
// ---------------------------------------------------------------------------
// Rendering: pseudo-3D "Mode 7" field rasterizer, stadium backdrop and
// procedural player sprites. Camera values match GSRenderCore.CameraConfig.
// World: x 0..53.33 across, y 0..120 (end zones 0-10 and 110-120); the
// offense always drives toward +y and the camera sits behind it.
// ---------------------------------------------------------------------------
const CAM = { focal: 317, horizon: 96, height: 6, back: 16, cy: H / 2 };
CAM.pitch = Math.atan((CAM.cy - CAM.horizon) / CAM.focal);
CAM.c = Math.cos(CAM.pitch); CAM.s = Math.sin(CAM.pitch);
const FIELD_W = 53.33;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];

class Camera {
  constructor() { this.x = 26.67; this.y = 20; this.z = CAM.height; this.shake = 0; this.sx = 0; this.sy = 0; }
  // Follow a focus point (ball or carrier), critically damped.
  follow(fx, fy, dt, zoom = 1) {
    const tx = clamp(fx, 14, FIELD_W - 14), ty = fy - CAM.back * zoom;
    const k = 1 - Math.exp(-dt / 0.22);
    this.x += (tx - this.x) * k; this.y += (ty - this.y) * k;
    this.z += (CAM.height * zoom - this.z) * (1 - Math.exp(-dt / 0.35));
    if (this.shake > 0) { this.shake = Math.max(0, this.shake - dt); const a = this.shake * 14; this.sx = (Math.random() * 2 - 1) * a; this.sy = (Math.random() * 2 - 1) * a; }
    else this.sx = this.sy = 0;
  }
  snap(fx, fy) { this.x = clamp(fx, 14, FIELD_W - 14); this.y = fy - CAM.back; this.z = CAM.height; }
  // World point -> {x, y, scale} in canvas pixels (null if behind the camera).
  project(wx, wy, wz = 0) {
    const dx = wx - this.x, dy = wy - this.y, dz = wz - this.z;
    const Z = dy * CAM.c - dz * CAM.s, Y = dy * CAM.s + dz * CAM.c;
    if (Z < 0.8) return null;
    const k = CAM.focal / Z;
    return { x: W / 2 + dx * k + this.sx, y: CAM.cy - Y * k + this.sy, k, Z };
  }
}

// --- Field ---------------------------------------------------------------
class FieldRenderer {
  constructor() { this.img = new ImageData(W, H); this.buf = new Uint32Array(this.img.data.buffer); this.backdrops = null; }
  static pack(c) { return (255 << 24) | ((c[2] & 255) << 16) | ((c[1] & 255) << 8) | (c[0] & 255); }
  setTeams(near, far) {
    this.near = near; this.far = far;
    const P = FieldRenderer.pack;
    this.cols = { a: P(PAL.turfA), b: P(PAL.turfB), side: P(PAL.turfSide), line: P(PAL.line), dirt: P(PAL.dirt), dirtD: P(shade(PAL.dirt, -0.25)),
      nearA: P(near), nearB: P(shade(near, -0.3)), farA: P(far), farB: P(shade(far, -0.3)), los: P(hex('#3FA7FF')), ltg: P(hex('#FFE45C')),
      haze: PAL.haze };
  }
  buildBackdrops(home, away) {
    // Two crowd frames, 800 px wide for parallax.
    const bw = 800, hz = CAM.horizon;
    this.backdrops = [0, 1].map((frame) => {
      const c = makeCanvas(bw, hz + 2), x = c.x;
      for (let y = 0; y < 26; y++) { rect(x, 0, y, bw, 1, mix(PAL.sky1, PAL.sky2, y / 26)); }
      const r = RNG(77 + frame * 0);
      // stands: three tiers of crowd pixels
      const crowd = ['#FF4D4D', '#FFD23F', '#3FA7FF', '#FFFFFF', '#7CFF6B', '#FF7AE0', '#F6CDA8', '#8C5634', '#2A2850'].map(hex);
      for (let y = 22; y < hz - 14; y++) for (let xx = 0; xx < bw; xx += 2) {
        const tier = y < 44 ? 0 : 1; const base = tier ? hex('#2A2850') : hex('#33305C');
        const rr = RNG(y * 1000 + xx); const v = rr();
        let col = v < 0.62 ? crowd[(rr() * crowd.length) | 0] : base;
        if (y % 6 === 5) col = shade(base, -0.4);
        const bob = frame && ((xx >> 3) + y) % 3 === 0 ? -1 : 0;
        rect(x, xx, y + bob, 2, 1, mix(col, base, tier ? 0.25 : 0.1));
      }
      rect(x, 0, 43, bw, 2, hex('#1F2A4A'));
      // scoreboard (decorative; live score is in the HUD)
      panel(x, bw / 2 - 60, 2, 120, 26, hex('#2A2850'), hex('#0B0A1E'));
      textC(x, 'GRIDIRON', bw / 2, 7, hex('#FFB238'), null); textC(x, 'SPIRIT', bw / 2, 16, hex('#3FD8FF'), null);
      // ad boards
      const ads = ['BLITZO GUM', 'KAIJUMOTO', 'HYPERNOVA TV', 'GOGO CURRY', 'PIXELPOP', 'TORII BANK', 'ZUNKO COLA', 'RAMEN ROCKET'];
      const adCols = ['#1A1838', '#E83E9C', '#18A8A0', '#FFF6E0', '#D8452B', '#1A1838', '#E83E9C', '#18A8A0'].map(hex);
      let ax = 0; let i = 0;
      while (ax < bw) { const t = ads[i % ads.length], w = textW(t) + 14, bg = adCols[i % adCols.length];
        rect(x, ax, hz - 13, w, 10, bg); rect(x, ax, hz - 13, 1, 10, PAL.ink);
        text(x, t, ax + 7, hz - 11, bg[0] > 200 && bg[1] > 200 ? hex('#D8452B') : hex('#FFE45C'), null); ax += w; i++; }
      rect(x, 0, hz - 3, bw, 5, hex('#1F2A4A')); rect(x, 0, hz - 3, bw, 1, hex('#6C7FB0'));
      // floodlights
      for (const lx of [60, 260, 540, 740]) { rect(x, lx - 10, 3, 20, 5, hex('#FFF6C0')); rect(x, lx - 1, 8, 2, 14, hex('#2A2850')); }
      return c;
    });
  }
  // los / ltg: world y of line of scrimmage and line to gain (null hides).
  render(ctx, cam, crowdFrame, los, ltg) {
    const buf = this.buf, C = this.cols, hz = CAM.horizon;
    const c = CAM.c, s = CAM.s, f = CAM.focal;
    const rowInfo = (row) => { const v = CAM.cy - (row + 0.5 - cam.sy); const dirY = f * c + v * s, dirZ = -f * s + v * c;
      if (dirZ > -1e-6) return null; const t = -cam.z / dirZ; return { wy: cam.y + t * dirY, t }; };
    let prev = rowInfo(hz);
    for (let row = hz + 1; row < H; row++) {
      const ri = rowInfo(row); if (!ri || !prev) { prev = ri; continue; }
      const wy = ri.wy, t = ri.t, yFar = prev.wy, span = Math.max(1e-3, yFar - wy);
      const dist = wy - cam.y;
      const fog = clamp((dist - 30) / 90, 0, 0.55);
      // Row-level features: stripes and lines (every line covers >= 1 row: no shimmer).
      const band = Math.floor((wy - 10) / 5);
      let rowCol = (band & 1) ? C.b : C.a;
      let inEnd = 0; if (wy < 10) inEnd = 1; else if (wy > 110) inEnd = 2;
      let lineHere = false;
      for (let ly = 10; ly <= 110; ly += 5) if (ly >= wy - 0.09 && ly <= yFar + 0.09) { lineHere = true; break; }
      if (wy < 0 || wy > 120) { rowCol = C.side; inEnd = 0; }
      const isLos = los != null && los >= wy - 0.12 && los <= yFar + 0.12;
      const isLtg = ltg != null && ltg >= wy - 0.12 && ltg <= yFar + 0.12 && ltg < 110;
      const hashRow = !lineHere && Math.abs(wy - Math.round(wy)) < Math.max(0.12, span * 0.6) && wy > 10 && wy < 110;
      const x0 = cam.x + t * (0.5 - W / 2 - cam.sx), base = row * W;
      const fogDither = fog > 0;
      for (let px = 0; px < W; px++) {
        const wx = x0 + t * px;
        let col;
        if (wx < -1.4 || wx > FIELD_W + 1.4 || wy < -1.4 || wy > 121.4) {
          col = (wx < -7 || wx > FIELD_W + 7 || wy < -6 || wy > 126) ? (((px >> 2) + row) & 1 ? C.dirt : C.dirtD) : C.side;
        } else if (wx < 0 || wx > FIELD_W || wy < 0 || wy > 120) col = C.line;               // boundary border
        else if (inEnd) {
          const st = (Math.floor((wx + wy) / 2.2) & 1);
          col = inEnd === 1 ? (st ? C.nearA : C.nearB) : (st ? C.farA : C.farB);
          if (lineHere) col = C.line;
        } else {
          col = rowCol;
          if (lineHere) col = C.line;
          else if (hashRow && ((wx > 22.9 && wx < 23.7) || (wx > 29.6 && wx < 30.4) || wx < 0.9 || wx > FIELD_W - 0.9)) col = C.line;
          if (isLos) col = C.los; else if (isLtg) col = C.ltg;
        }
        if (fogDither && BAYER[((row & 3) << 2) | (px & 3)] / 16 < fog) {
          const r = col & 255, g = (col >> 8) & 255, b = (col >> 16) & 255;
          col = (255 << 24) | (((b + C.haze[2]) >> 1) << 16) | (((g + C.haze[1]) >> 1) << 8) | ((r + C.haze[0]) >> 1);
        }
        buf[base + px] = col;
      }
      prev = ri;
    }
    ctx.putImageData(this.img, 0, 0, 0, hz, W, H - hz);
    // Backdrop with slight parallax.
    const bd = this.backdrops[crowdFrame & 1];
    const ox = clamp(-80 - (cam.x - 26.67) * 3, -160, 0) | 0;
    ctx.drawImage(bd, ox, (cam.sy | 0) + 1 - 2);
  }
}

// --- Player sprites --------------------------------------------------------
const SKIN = ['#F6CDA8', '#E2A877', '#C07D4E', '#8C5634', '#5E3A22'].map(hex);
const spriteCache = new Map();
// look: {jersey, trim, pants, helmet, style}; pose: idle|run0..3|throw|stance|down|dive
function playerSprite(look, h, view, pose, number, skin, big, aura) {
  h = clamp(h & ~1, 10, 96);
  const key = `${look.id}|${h}|${view}|${pose}|${h >= 30 ? number : -1}|${skin}|${big ? 1 : 0}|${aura || ''}`;
  let c = spriteCache.get(key); if (c) return c;
  const lying = pose === 'down' || pose === 'dive';
  const w = Math.max(6, Math.round(h * (big ? 0.66 : 0.56)));
  const cw = lying ? h + 4 : w + 6, ch = lying ? Math.round(w * 0.8) + 4 : h + 3;
  c = makeCanvas(cw, ch); const x = c.x;
  const J = look.jersey, T = look.trim, P = look.pants, Hm = look.helmet, S = SKIN[skin % SKIN.length];
  if (lying) {
    // Horizontal body: helmet at the right for a dive, left when down.
    const bh = Math.round(w * 0.55), y0 = ch - bh - 2, hr = Math.max(2, bh * 0.55);
    const dir = pose === 'dive' ? 1 : -1, cx = cw / 2;
    rect(x, cx - h * 0.35, y0, h * 0.4, bh, J);                // torso
    rect(x, cx - h * 0.35, y0, h * 0.4, Math.max(1, bh * 0.2), T);
    rect(x, cx - h * 0.35 - h * 0.25 * dir * (dir < 0 ? -1 : 1) * 0, y0 + bh * 0.2, h * 0.02, 1, J);
    rect(x, dir > 0 ? cx - h * 0.62 : cx + 0.05 * h, y0 + bh * 0.15, h * 0.3, bh * 0.7, P);   // legs/pants
    ellipse(x, dir > 0 ? cx + h * 0.15 : cx - h * 0.42, y0 + bh / 2, hr, hr, Hm);
    outline(c, PAL.outline); spriteCache.set(key, c); return c;
  }
  const cx = cw / 2, top = 1;
  const u = h / 30; // unit: 1 at 30 px tall
  const helmR = Math.max(2, 3.3 * u), headY = top + helmR;
  const shoulderW = w * (big ? 1.0 : 0.94), waistW = w * 0.62;
  const torsoTop = top + helmR * 1.7, torsoBot = top + h * 0.56, pantsBot = top + h * 0.74;
  const crouch = pose === 'stance' ? h * 0.08 : 0;
  // legs (run cycle)
  const phase = pose.startsWith('run') ? +pose[3] : -1;
  const legW = Math.max(2, waistW * 0.36), legTop = pantsBot - 1 - crouch, legLen = top + h - legTop - 1;
  const legs = [[-1, 0], [1, 0]];
  if (phase >= 0) { const lift = [[0.3, 0], [0, 0.25], [0, 0.3], [0.25, 0]][phase]; legs[0][1] = lift[0]; legs[1][1] = lift[1]; }
  for (const [side, lift] of legs) {
    const lx = cx + side * waistW * 0.26 - legW / 2, ll = legLen * (1 - lift);
    rect(x, lx, legTop, legW, ll * 0.45, P);
    rect(x, lx, legTop + ll * 0.45, legW, ll * 0.55, shade(J, -0.2).map((v, i) => [230, 230, 236][i] * 0.6 + v * 0.4)); // socks
    rect(x, lx - (view === 'front' ? 0 : 0), legTop + ll - Math.max(1, u * 1.2), legW + 1, Math.max(1, u * 1.2), hex('#1A1420'));
  }
  // pants
  rect(x, cx - waistW / 2, torsoBot - crouch, waistW, pantsBot - torsoBot, P);
  rect(x, cx - waistW / 2, pantsBot - crouch - 1, waistW, 1, shade(P, -0.4));
  // torso: shoulder pads tapering to waist
  for (let y = torsoTop + crouch; y < torsoBot - crouch * 0.2; y++) {
    const tt = (y - torsoTop - crouch) / Math.max(1, torsoBot - torsoTop);
    const ww = tt < 0.3 ? shoulderW : lerp(shoulderW, waistW, (tt - 0.3) / 0.7);
    rect(x, cx - ww / 2, y, ww, 1, J);
  }
  rect(x, cx - shoulderW / 2, torsoTop + crouch, shoulderW, Math.max(1, u * 1.4), T);       // pad trim
  rect(x, cx - shoulderW / 2, torsoTop + crouch, Math.max(1, u), torsoBot - torsoTop, shade(J, 0.3));
  rect(x, cx + shoulderW / 2 - Math.max(1, u), torsoTop + crouch, Math.max(1, u), torsoBot - torsoTop, shade(J, -0.35));
  // arms
  const armW = Math.max(1, u * 1.8), armL = h * 0.27;
  const swing = phase >= 0 ? [1, 0, -1, 0][phase] * u * 2 : 0;
  const ay = torsoTop + crouch + u;
  if (pose === 'throw') {
    rect(x, cx + shoulderW / 2 - armW, ay - armL * 0.8, armW, armL, S);
    rect(x, cx - shoulderW / 2 - armW + 1, ay + u, armW, armL * 0.8, S);
  } else {
    rect(x, cx - shoulderW / 2 - armW + 1, ay + swing, armW, armL, J); rect(x, cx - shoulderW / 2 - armW + 1, ay + swing + armL * 0.55, armW, armL * 0.45, S);
    rect(x, cx + shoulderW / 2 - 1, ay - swing, armW, armL, J); rect(x, cx + shoulderW / 2 - 1, ay - swing + armL * 0.55, armW, armL * 0.45, S);
  }
  // number
  if (h >= 30 && number != null) {
    const k = h >= 60 ? 2 : 1, ns = String(number), nw = textW(ns) * k;
    text(x, ns, cx - nw / 2, torsoTop + crouch + (torsoBot - torsoTop) * 0.32, T, null, k);
  }
  // helmet
  ellipse(x, cx, headY + crouch, helmR * 1.05, helmR, Hm);
  rect(x, cx - helmR * 1.05, headY + crouch + helmR * 0.3, helmR * 2.1, Math.max(1, helmR * 0.5), Hm);
  if (look.style === 0) rect(x, cx - Math.max(1, u * 0.6), headY + crouch - helmR, Math.max(1, u * 1.2), helmR * 1.2, hex('#F6C040'));     // gold crest
  if (look.style === 1) { rect(x, cx - 1, headY + crouch - helmR + 1, Math.max(1, u), helmR, T); }
  if (look.style === 2) { rect(x, cx - helmR * 0.5, headY + crouch - helmR, Math.max(1, u), helmR, T); rect(x, cx + helmR * 0.5 - 1, headY + crouch - helmR, Math.max(1, u), helmR, T); }
  if (view === 'front') {
    rect(x, cx - helmR * 0.7, headY + crouch - helmR * 0.05, helmR * 1.4, helmR * 0.55, S);              // face
    rect(x, cx - helmR * 0.7, headY + crouch + helmR * 0.25, helmR * 1.4, Math.max(1, u * 0.7), hex('#C8CCD8')); // facemask
    if (h >= 36) { rect(x, cx - helmR * 0.4, headY + crouch, Math.max(1, u * 0.7), Math.max(1, u * 0.7), PAL.ink); rect(x, cx + helmR * 0.25, headY + crouch, Math.max(1, u * 0.7), Math.max(1, u * 0.7), PAL.ink); }
  } else rect(x, cx - helmR * 0.5, headY + crouch - helmR * 0.4, Math.max(1, helmR * 0.35), Math.max(1, helmR * 0.35), shade(Hm, 0.5));
  outline(c, PAL.outline);
  if (aura) { // dithered Spirit aura ring
    const a = makeCanvas(cw + 4, ch + 4); a.x.drawImage(c, 2, 2);
    const id = a.x.getImageData(0, 0, a.width, a.height), d = id.data, ac = hex(aura);
    for (let y = 0; y < a.height; y++) for (let xx = 0; xx < a.width; xx++) { const i = (y * a.width + xx) * 4; if (d[i + 3]) continue;
      let near = false; for (let oy = -2; oy <= 2 && !near; oy++) for (let ox = -2; ox <= 2; ox++) { const yy = y + oy, x2 = xx + ox;
        if (yy >= 0 && x2 >= 0 && yy < a.height && x2 < a.width && d[(yy * a.width + x2) * 4 + 3] && Math.abs(ox) + Math.abs(oy) <= 3) { near = true; break; } }
      if (near && ((xx + y) & 1)) { d[i] = ac[0]; d[i + 1] = ac[1]; d[i + 2] = ac[2]; d[i + 3] = 255; } }
    a.x.putImageData(id, 0, 0); c = a;
  }
  spriteCache.set(key, c); return c;
}

function ballSprite(len, ang) {
  const key = len + '|' + ang; let c = spriteCache.get('ball' + key); if (c) return c;
  const s = len + 4; c = makeCanvas(s, s);
  c.x.translate(s / 2, s / 2); c.x.rotate(ang);
  ellipse(c.x, 0, 0, len / 2, Math.max(1.2, len / 3.4), hex('#8A4A24'));
  if (len >= 5) c.x.fillStyle = '#FFFFFF', c.x.fillRect(-1, -0.5, 2, 1);
  c.x.setTransform(1, 0, 0, 1, 0, 0); outline(c, PAL.outline);
  spriteCache.set('ball' + key, c); return c;
}

function starburst(ctx, x, y, r, frame) {
  const n = 10, ins = r * 0.45;
  ctx.fillStyle = frame < 2 ? '#FFFFFF' : '#FFE45C';
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = i / (n * 2) * TAU + frame * 0.3, rr = i & 1 ? ins : r * (0.8 + ((i * 7) % 3) * 0.12);
    ctx.lineTo(Math.round(x + Math.cos(a) * rr), Math.round(y + Math.sin(a) * rr)); }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#FF7A2E'; ctx.beginPath(); ctx.arc(x, y, ins * 0.6, 0, TAU); ctx.fill();
}

// ==== 04-sim.js
// ---------------------------------------------------------------------------
// Simulation: one play of 7v7 football at 120 Hz. Canonical frame: the
// offense drives toward +y; x is 0..53.33 across the field. Formations,
// routes and assignments come from the real playbook (plays.json).
// ---------------------------------------------------------------------------
const G = 10.7;                       // gravity, yd/s^2
const OFF_SLOTS = ['QB', 'RB', 'WR1', 'WR2', 'C', 'LG', 'RG'];
const DEF_SLOTS = ['DL1', 'DL2', 'LB1', 'LB2', 'CB1', 'CB2', 'S'];
const POS_SLOTS = { qb: ['QB'], rb: ['RB'], wr: ['WR1', 'WR2'], c: ['C'], og: ['LG', 'RG'], dl: ['DL1', 'DL2'], lb: ['LB1', 'LB2'], cb: ['CB1', 'CB2'], s: ['S'] };
const DIFF = {
  rookie: { name: 'ROOKIE', runRead: 0.75, react: 0.45, read: 1.6, open: 3.2, pursuit: 0.62, tackle: 0.82, cover: 1.6 },
  pro: { name: 'PRO', runRead: 0.55, react: 0.25, read: 1.15, open: 2.5, pursuit: 0.92, tackle: 1.0, cover: 1.15 },
  legend: { name: 'LEGEND', runRead: 0.35, react: 0.12, read: 0.8, open: 2.0, pursuit: 1.0, tackle: 1.12, cover: 0.85 },
};

function slotRoster(team) {
  const out = {}; const used = {};
  for (const p of team.roster) { const list = POS_SLOTS[p.position] || []; const i = used[p.position] || 0;
    if (list[i]) { out[list[i]] = p; used[p.position] = i + 1; } }
  return out;
}

class Player {
  constructor(id, side, teamIdx, slot, data, look) {
    Object.assign(this, { id, side, teamIdx, slot, data, look });
    const r = data.ratings;
    this.top = 5.4 + r.speed / 99 * 4.3; this.acc = 7 + r.acceleration / 99 * 11; this.agi = r.agility / 99;
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0; this.z = 0; this.vz = 0;
    this.state = 'ok'; this.timer = 0; this.anim = 0; this.move = null; this.moveT = 0; this.engaged = null;
    this.big = ['c', 'og', 'dl'].includes(data.position);
    this.skin = (data.number * 7 + id) % 5; this.contact = {}; this.react = 0; this.reactTarget = null;
  }
  get speed() { return Math.hypot(this.vx, this.vy); }
  get up() { return this.state === 'ok' || this.state === 'engaged'; }
}

class Play {
  // human: team index the human controls (or null), off: offense team index.
  constructor(match, offPlay, defPlay) {
    const m = this.m = match; this.offPlay = offPlay; this.defPlay = defPlay;
    this.diff = DIFF[m.difficulty]; this.time = 0; this.phase = 'pre'; this.events = [];
    this.los = 10 + m.state.ballOn; this.ballX = m.ballX;
    const off = m.state.poss, def = 1 - off;
    this.offTeam = off; this.defTeam = def;
    this.players = [];

    if (b.z <= 0) { b.z = 0; if (b.state === 'loose') { b.vx *= 0.6; b.vy *= 0.6; b.vz = Math.abs(b.vz) * 0.4; } } }
  updateBall(dt) {
    const b = this.ball;
    if (b.state === 'held') { const h = this.players[b.holder]; b.x = h.x + 0.25; b.y = h.y + 0.1 * h.facing; b.z = 1.1; return; }
    if (b.state !== 'air') return;
    this.ballPhysics(dt); b.flight = (b.flight || 0) + dt;
    // Catch window: closest approach to each player near the ball.
    if (b.z < 3 && b.z > 0.2) {
      const cands = this.players.filter((p) => p.up && !b.tried[p.id] && !(p.id === b.passer && b.flight < 0.4) && Math.hypot(p.x - b.x, p.y - b.y) < (p.id === b.target ? 1.6 : 1.05) && (p.side === 'def' || p.id === b.target || b.target === -1 || b.pitch));
      cands.sort((a, c) => (a.side === 'def' ? 0 : 1) - (c.side === 'def' ? 0 : 1));
      for (const p of cands) {
        b.tried[p.id] = true;
        if (b.pitch) { if (p.side === 'off') { this.giveBall(p); return; } continue; }
        const nearDef = Math.min(...this.players.filter((d) => d.side !== p.side && d.up).map((d) => Math.hypot(d.x - p.x, d.y - p.y)));
        if (p.side === 'def') {
          if (b.flight < 0.2) { if (rng() < 0.12) { this.emit('tip', { x: b.x, y: b.y, z: b.z }); b.vx *= 0.25; b.vy *= 0.25; b.vz = 2.5; b.target = -1; return; } continue; }   // at the line: rare batted ball
          const tgt = this.players[b.target], recvNear = tgt ? Math.hypot(tgt.x - b.x, tgt.y - b.y) : 9;   // tipped balls have no target
          let pi = 0.05 + p.data.ratings.catching / 99 * 0.2 + (this.fx.def.instantReads ? 0.12 : 0) + (recvNear > 3 ? 0.12 : 0);
          if (this.fx.off.perfectPass) pi *= 0.3;
          if (rng() < pi) { this.giveBall(p); this.endPlay('interception', { by: p }); this.emit('pick', { p }); return; }
          if (rng() < 0.35) { this.emit('tip', { x: b.x, y: b.y, z: b.z }); b.vx *= 0.3; b.vy *= 0.3; b.vz = 3; b.target = -1; return; }
        } else {
          let pc = 0.5 + p.data.ratings.catching / 99 * 0.42 + (this.fx.off.catchBonus || 0) - (nearDef < 1.8 ? (1.8 - nearDef) / 1.8 * 0.5 : 0);
          if (this.fx.off.perfectPass) pc += 0.15;
          if (rng() < pc) { this.giveBall(p); this.emit('catch', { p, contested: nearDef < 1.4 }); this.stats.passFrom = this.los; return; }
          this.emit('drop', { p });
        }
      }
    }
    if (b.z <= 0) { this.endPlay('incomplete'); }
  }
  giveBall(p) { const b = this.ball; b.state = 'held'; b.holder = p.id; b.pitch = false;
    if (this.humanSide === 'off' && p.side === 'off') this.controlled = p; }

  // --- contact -----------------------------------------------------------
  doMove(kind) {
    const c = this.ballCarrier, me = this.controlled;
    if (kind === 'dive' && me) { const dir = me === c ? [0, 1] : [me.vx, me.vy]; const l = Math.hypot(dir[0], dir[1]) || 1;
      me.state = 'dive'; me.timer = 0.45; me.vx = dir[0] / l * (me.top + 1.5); me.vy = dir[1] / l * (me.top + 1.5); this.emit('move');
      if (me === c) { this.diveForward = true; } return; }
    if (!c || c !== me || c === this.qb) return;
    if (c.moveCool > this.time) return;
    c.move = kind; c.moveT = kind === 'stiff' ? 0.45 : 0.32; c.moveCool = this.time + 0.7;
    c.jukeDir = (c.vx >= 0 ? 1 : -1) * (kind === 'juke' ? 1 : 0);
    if (kind === 'spin') { c.vx *= 0.9; c.vy *= 0.9; }
    this.emit('move', { kind, p: c });
  }
  // CPU pursuers lunge when the runner is just out of reach: long reach,
  // but a miss leaves them on the turf.
  cpuDives(dt) {
    const c = this.ballCarrier; if (!c || (c === this.qb && c.y < this.los)) return;
    for (const d of this.players) {
      if (d.side !== 'def' || d.state !== 'ok' || d === this.controlled) continue;
      const tx = c.x + c.vx * 0.15, ty = c.y + c.vy * 0.15, dist = Math.hypot(tx - d.x, ty - d.y);
      if (dist > 1.1 && dist < 2.5 && rng() < dt * 6) {
        d.state = 'dive'; d.timer = 0.4; const k = (d.top + 1.5) / dist; d.vx = (tx - d.x) * k; d.vy = (ty - d.y) * k; }
    }
  }
  tackles(dt) {
    const c = this.ballCarrier; if (!c) return;
    if (c.state === 'dive' && this.diveForward && c.timer < 0.1) { this.endPlay('tackled', { x: c.x, y: c.y + 0.6 }); return; }
    for (const d of this.players) {
      if (d.side !== 'def' || d === c) continue;
      if (!(d.state === 'ok' || d.state === 'dive' || d.state === 'engaged')) continue;
      const reach = d.state === 'dive' ? 1.6 : d.engaged ? 0.75 : 1.15;
      const dist = Math.hypot(d.x - c.x, d.y - c.y);
      if (dist > reach || (d.contact[c.id] || 0) > this.time) continue;
      d.contact[c.id] = this.time + 0.6;
      const r = d.data.ratings, cr = c.data.ratings, eo = this.fx.off, ed = this.fx.def;
      const rvx = d.vx - c.vx, rvy = d.vy - c.vy, closing = Math.hypot(rvx, rvy);
      const impact = closing * (0.6 + (r.strength + d.data.ratings.weightLbs / 3) / 160);
      let power = 0.45 + r.strength / 99 * 0.3 + Math.min(closing, 10) * 0.025 + (d.state === 'dive' ? 0.15 : 0) + (ed.tacklePower || 0) - (d.engaged ? 0.65 : 0);
      let resist = 0.2 + cr.strength / 99 * 0.2 + cr.balance / 99 * 0.3 + (eo.tackleResist || 0);
      if (c.move && c.moveT > 0) resist += eo.unbreakableMoves ? 9 : c.move === 'stiff' ? 0.45 : 0.55;
      if (c === this.qb) resist -= 0.2;
      let p = clamp(power - resist * 0.85 + 0.42, 0.12, 0.96);
      if (this.humanSide === 'off' && c === this.controlled) p *= this.diff.tackle; else if (this.humanSide === 'def') p /= this.diff.tackle * 0.95;
      if (rng() < p) {
        const big = closing > 13 && r.strength >= 60 && d.state !== 'dive' && rng() < 0.55;
        const fumble = big && c !== this.qb && rng() < clamp((impact - 7) * 0.02, 0, 0.07);
        const fx = c.x, fy = c.y + (c.vy > 1 ? 0.6 : 0);
        c.state = 'down'; c.timer = 1.2; d.state = d.state === 'dive' ? 'dive' : 'ok';
        this.emit('tackle', { x: fx, y: fy, big, impact, by: d, carrier: c });
        if (fumble) { const defRec = rng() < 0.55; this.emit('fumble', { x: fx, y: fy }); this.endPlay(defRec ? 'fumbleLost' : 'tackled', { x: fx, y: fy, fumble: true }); }
        else this.endPlay(c === this.qb && fy < this.los ? 'sack' : 'tackled', { x: fx, y: fy, big, by: d });
        return;
      } else {
        d.state = 'down'; d.timer = 0.8; if (d.engaged) d.engaged = null;
        c.vx *= 0.85; c.vy *= 0.85;
        this.emit('broken', { p: c, by: d, kind: c.move });
      }
    }
  }
  boundaries() {
    const c = this.ballCarrier; if (!c) return;
    if (c.y >= 110 && c.side === 'off') { this.endPlay('touchdown', { x: c.x, y: c.y }); return; }
    if (c.x < 0 || c.x > FIELD_W) { this.endPlay('outOfBounds', { x: clamp(c.x, 0, FIELD_W), y: c.y }); return; }
    if (c.y < 10 && c.y < this.los - 0.5 && c.state === 'down') this.endPlay('safety', { x: c.x, y: c.y });
  }
  endPlay(kind, info = {}) {
    if (this.phase !== 'live') return;
    this.phase = 'dead'; this.result = Object.assign({ kind, x: this.ball.x, y: this.ball.y }, info);
    if (kind === 'touchdown' || kind === 'incomplete' || kind === 'outOfBounds' || kind === 'safety' || kind === 'interception') this.emit('whistle', { kind });
    if (this.ball.state === 'air') { this.ball.state = 'loose'; }
  }
}

// ==== 05-match.js
// ---------------------------------------------------------------------------
// Match: rules (downs, scoring, clock, overtime), play calling, Spirit Plays,
// presentation (callouts, hit-stop, shake, impact frames) and the game HUD.
// ---------------------------------------------------------------------------
const OFF_PAGES = [['hb_dive', 'slants', 'verticals'], ['toss_sweep', 'curl_flat', 'post_corner']];
const DEF_PAGES = [['cover2', 'man_press', 'lb_blitz'], ['cover3', 'prevent', 'zero_blitz']];
const TEAM_LOOK = (t, style) => ({ id: t.id, jersey: hex(t.colors.primary), trim: hex(t.colors.accent), pants: hex(t.colors.secondary),
  helmet: shade(hex(t.colors.secondary), 0.15), style });
const ARCH = { disciplined: 0, flashy: 1, powerhouse: 2 };

class Match {
  constructor(opts) {
    // opts: teams [A,B], human (0|null), difficulty, qLen, spiritBonus, mode, attract
    Object.assign(this, opts);
    this.looks = this.teams.map((t) => TEAM_LOOK(t, ARCH[t.archetype] ?? 0));
    const recv = rng.int(2);
    this.state = { score: [0, 0], poss: recv, firstPoss: recv, ballOn: 25, down: 1, toGo: 10, quarter: 1, clock: this.qLen, ot: 0, otDone: [0, 0], final: false };
    this.ballX = 26.67; this.spiritMeter = [0, 0]; this.activeSpirit = [null, null];
    this.stats = [0, 1].map(() => ({ passYds: 0, rushYds: 0, td: 0, sacks: 0, takeaways: 0, bigHits: 0, firstDowns: 0, spirits: 0, fg: 0, deficit: 0, broken: 0 }));
    this.players = {}; // name -> {yds, td, tkl, team}
    this.cam = new Camera(); this.fx = { callout: null, parts: [], bursts: [], hitstop: 0, impact: false, trail: [], flash: 0 };
    this.phase = 'call'; this.timer = 0; this.page = 0; this.log = [];
    this.spirits = Object.fromEntries(DATA.spirits.spirits.map((s) => [s.id, s]));
    this.newPlay();
  }
  get offIsHuman() { return this.human != null && this.state.poss === this.human; }
  get defIsHuman() { return this.human != null && this.state.poss !== this.human; }
  plays(id) { return DATA.plays.offense.find((p) => p.id === id) || DATA.plays.defense.find((p) => p.id === id); }

  // --- play calling ---------------------------------------------------------
  newPlay() {
    this.phase = 'call'; this.timer = 0; this.page = 0; this.offCall = null; this.defCall = null;
    this.play = null; this.fx.trail = [];
    // Show the formation of a neutral play behind the cards.
    const s = this.state;
    this.cam.snap(this.ballX, 10 + s.ballOn);
    if (this.human == null) { this.cpuCalls(); return; }
  }
  cardsFor() {
    const s = this.state, pages = this.offIsHuman ? OFF_PAGES.map((p) => p.slice()) : DEF_PAGES.map((p) => p.slice());
    if (this.offIsHuman && s.down === 4 && !s.ot) pages.unshift(['punt', 'field_goal', 'hb_dive'].filter((id) => id !== 'field_goal' || 100 - s.ballOn + 17 <= 60));
    return pages;
  }
  humanCall(id) {
    if (this.phase !== 'call') return;
    if (this.offIsHuman) this.offCall = id; else this.defCall = id;
    this.cpuCalls();
  }
  cpuCalls() {
    const s = this.state, off = this.teams[s.poss];
    if (!this.offCall) this.offCall = this.cpuOffense(off);
    if (!this.defCall) {
      const r = rng(); this.defCall = s.toGo >= 9 && s.down >= 3 ? (r < 0.5 ? 'prevent' : 'cover3') : s.toGo <= 3 ? (r < 0.45 ? 'lb_blitz' : r < 0.8 ? 'man_press' : 'zero_blitz')
        : rng.pick(['cover2', 'cover3', 'man_press', 'lb_blitz', 'cover2', 'zero_blitz']);
    }
    if (this.offCall === 'punt' || this.offCall === 'field_goal') { this.startKick(this.offCall); return; }
    this.cpuSpirit();
    this.play = new Play(this, this.plays(this.offCall), this.plays(this.defCall));
    this.phase = 'pre'; this.timer = 0;
  }
  cpuOffense(team) {
    const s = this.state, fgDist = 100 - s.ballOn + 17, late = s.quarter >= 4 && s.clock < 60;
    if (s.down === 4 && !s.ot) {
      const trailing = s.score[s.poss] < s.score[1 - s.poss];
      if (fgDist <= 52 && !(late && trailing && s.score[1 - s.poss] - s.score[s.poss] > 3)) return 'field_goal';
      if (s.toGo <= 2 && s.ballOn > 40 || (late && trailing)) return s.toGo <= 2 ? 'hb_dive' : 'verticals';
      return 'punt';
    }
    const a = team.archetype; let pass = s.toGo >= 8 ? 0.72 : s.toGo <= 3 ? 0.35 : 0.52;
    if (a === 'powerhouse') pass -= 0.15; if (a === 'flashy') pass += 0.08;
    if (rng() < pass) { const deep = (s.toGo >= 12 ? 0.6 : 0.3) + (a === 'flashy' ? 0.15 : 0);
      return rng() < deep ? rng.pick(['verticals', 'post_corner']) : rng.pick(['slants', 'curl_flat']); }
    return rng() < (a === 'powerhouse' ? 0.65 : 0.5) ? 'hb_dive' : 'toss_sweep';
  }
  // --- Spirit --------------------------------------------------------------
  star(team, side, playType) {
    const ids = this.teams[team].roster.filter((p) => p.spiritPlay).map((p) => [p, this.spirits[p.spiritPlay]]).filter(([, s]) => s && s.side === side);
    return ids.find(([, s]) => s.playType === playType) || ids.find(([, s]) => s.playType === 'any') || ids[0];
  }
  canSpirit(team) { return this.spiritMeter[team] >= 1 && this.phase === 'pre' && !this.activeSpirit[team]; }
  activateSpirit(team) {
    if (!this.canSpirit(team)) return false;
    const side = team === this.state.poss ? 'offense' : 'defense';
    const pt = this.plays(this.offCall).category === 'run' ? 'run' : 'pass';
    const st = this.star(team, side, side === 'offense' ? pt : 'any'); if (!st) return false;
    const [player, sp] = st;
    this.spiritMeter[team] = 0; this.activeSpirit[team] = sp; this.stats[team].spirits++;
    this.cutin = { team, player, sp, t: 0 }; this.phase = 'cutin'; this.timer = 0;
    Audio.sfx('spirit'); Audio.crowd(0.9); haptic(30);
    // rebuild the play so the effects apply
    this.play = new Play(this, this.plays(this.offCall), this.plays(this.defCall));
    this.play.starId = player.id;
    return true;
  }
  cpuSpirit() {
    const s = this.state;
    for (const t of [0, 1]) { if (t === this.human || this.spiritMeter[t] < 1) continue;
      const critical = s.down >= 3 || s.ballOn > 75 || (s.quarter >= 4 && s.score[t] < s.score[1 - t]);
      if (critical) this.pendingCpuSpirit = t; }
  }
  charge(team, amt) { const trailing = this.state.score[team] < this.state.score[1 - team];
    this.spiritMeter[team] = Math.min(1, this.spiritMeter[team] + amt * 0.5 * (trailing ? 1.35 : 1) * (1 + (team === this.human ? this.spiritBonus || 0 : 0))); }

  // --- kicks ---------------------------------------------------------------
  startKick(kind) {
    this.kick = { kind, t: 0, stopped: null, human: this.offIsHuman && kind === 'field_goal' };
    this.phase = 'kick'; this.timer = 0;
  }
  kickTap() { if (this.phase === 'kick' && this.kick.human && this.kick.stopped == null) { this.kick.stopped = this.kickNeedle(); Audio.sfx('kick'); } }
  kickNeedle() { return Math.sin(this.kick.t * 3.4) ; }
  resolveKick() {
    const s = this.state, k = this.kick, team = s.poss;
    if (k.kind === 'punt') {
      Audio.sfx('kick');
      const net = 36 + rng() * 12 + (this.teams[team].roster.find((p) => p.position === 'k')?.ratings.throwPower || 70) / 99 * 4;
      const land = s.ballOn + net;
      this.say(land >= 100 ? 'TOUCHBACK' : `PUNT ${Math.round(net)} YDS`, 'chrome', 1.4);
      this.changePoss(land >= 100 ? 20 : clamp(100 - land, 1, 99));
      return;
    }
    const dist = Math.round(100 - s.ballOn + 17);
    let good;
    if (k.human) { const zone = clamp(0.32 - (dist - 20) * 0.0055, 0.08, 0.3); good = k.stopped != null && Math.abs(k.stopped) < zone; }
    else good = rng() < clamp(1.04 - (dist - 20) * 0.017, 0.15, 0.97);
    if (good) { s.score[team] += 3; this.stats[team].fg++; this.say(`${dist} YD FIELD GOAL!`, 'fire', 1.8); Audio.crowd(0.8);
      this.log.push(`${this.teams[team].abbreviation} FG ${dist}`); this.kickoff(1 - team); }
    else { this.say('NO GOOD!', 'chrome', 1.6); this.changePoss(Math.max(20, 100 - (s.ballOn - 7))); }
  }

  // --- rules -----------------------------------------------------------------
  changePoss(newBallOn) {
    const s = this.state;
    if (s.ot) this.otPossessionDone();
    s.poss = 1 - s.poss; s.ballOn = newBallOn; s.down = 1; s.toGo = Math.min(10, 100 - newBallOn);
    if (s.ot && !s.final) { s.ballOn = 75; s.toGo = 10; }
  }
  kickoff(receiver) {
    const s = this.state; if (s.ot) { this.otPossessionDone(); if (s.final) return; }
    s.poss = receiver; s.ballOn = s.ot ? 75 : 25; s.down = 1; s.toGo = 10; this.ballX = 26.67;
  }
  otPossessionDone() {
    const s = this.state; s.otDone[s.poss]++;
    if (s.otDone[0] === s.otDone[1] && s.score[0] !== s.score[1]) s.final = true;
  }
  applyResult(r) {
    const s = this.state, p = this.play, team = s.poss, def = 1 - team, st = this.stats;
    const spotY = r.y ?? p.ball.y, newOn = clamp(spotY - 10, 0.5, 109.5), gain = newOn - s.ballOn;
    this.ballX = clamp(r.x ?? 26.67, 20, 33.33);
    const carrier = p.ballCarrier, name = carrier ? carrier.data.lastName.toUpperCase() : '';
    const credit = (n, k, v) => { if (!n) return; const e = this.players[n] || (this.players[n] = { yds: 0, td: 0, tkl: 0, sacks: 0, picks: 0, team: k }); for (const key in v) e[key] += v[key]; };
    const yardsTo = (kindPass) => { if (kindPass) st[team].passYds += gain; else st[team].rushYds += gain; credit(name, team, { yds: gain }); };
    const passPlay = !!p.thrown && !p.handedOff;
    const stopsClock = ['incomplete', 'touchdown', 'interception', 'fumbleLost', 'safety'].includes(r.kind) || (r.kind === 'outOfBounds' && s.clock < 60);
    let runoff = stopsClock ? 0 : 6;
    switch (r.kind) {
      case 'touchdown': {
        yardsTo(passPlay); st[team].td++; credit(name, team, { td: 1 }); s.score[team] += 6;
        if (this.activeSpirit[team]) st[team].spiritTD = (st[team].spiritTD || 0) + 1;
        this.say('TOUCHDOWN!', 'rainbow', 2.4, 4); Audio.play('touchdown'); Audio.crowd(1); haptic([20, 40, 60]);
        this.charge(team, 0.25); this.log.push(`${this.teams[team].abbreviation} TD ${name}`);
        const pat = rng() < 0.94; if (pat) s.score[team] += 1;
        this.pat = pat ? 'EXTRA POINT GOOD' : 'EXTRA POINT MISSED';
        this.kickoff(def); break; }
      case 'safety': s.score[def] += 2; this.say('SAFETY!', 'fire', 1.8); this.kickoff(def); break;
      case 'interception': case 'fumbleLost': {
        st[def].takeaways++; if (r.by) credit(r.by.data.lastName.toUpperCase(), def, { picks: r.kind === 'interception' ? 1 : 0 });
        this.say(r.kind === 'interception' ? 'INTERCEPTION!' : 'FUMBLE LOST!', 'fire', 2); Audio.crowd(0.9); this.charge(def, 0.3);
        this.changePoss(clamp(100 - newOn, 1, 99)); break; }
      case 'incomplete': this.advanceDown(0, false); break;
      default: { // tackled, sack, out of bounds
        if (newOn <= 0.5) { s.score[def] += 2; this.say('SAFETY!', 'fire', 1.8); this.kickoff(def); break; }
        if (r.kind === 'sack') { st[def].sacks++; if (r.by) credit(r.by.data.lastName.toUpperCase(), def, { sacks: 1 }); this.say('SACK!', 'fire', 1.6, 4); this.charge(def, 0.18); }
        else yardsTo(passPlay);
        if (r.by) credit(r.by.data.lastName.toUpperCase(), def, { tkl: 1 });
        if (r.big) { st[def].bigHits++; this.charge(def, 0.1); }
        if (gain >= 20) this.charge(team, 0.15);
        if (gain > 0) this.charge(team, gain * 0.012); else this.charge(def, 0.05);
        s.ballOn = newOn; this.advanceDown(gain, true);
      }
    }
    // clock
    if (!s.ot) { s.clock = Math.max(0, s.clock - runoff); }
    st[team].deficit = Math.max(st[team].deficit, s.score[def] - s.score[team]);
    st[def].deficit = Math.max(st[def].deficit, s.score[team] - s.score[def]);
    this.activeSpirit = [null, null];
  }
  advanceDown(gain, moved) {
    const s = this.state;
    if (moved && gain >= s.toGo) { s.down = 1; s.toGo = Math.min(10, 100 - s.ballOn); this.stats[s.poss].firstDowns++;
      if (!this.fx.callout || this.fx.callout.big < 3) this.say('FIRST DOWN!', 'chrome', 1.5, 3); this.charge(s.poss, 0.06); return; }
    if (moved) s.toGo -= gain;
    s.toGo = Math.max(0.5, s.toGo);
    s.down++;
    if (s.down > 4) { this.say('TURNOVER ON DOWNS', 'chrome', 1.6); this.changePoss(clamp(100 - s.ballOn, 1, 99)); }
  }
  endQuarterIfNeeded() {
    const s = this.state; if (s.ot || s.clock > 0) return false;
    if (s.quarter === 2) { s.quarter = 3; s.clock = this.qLen; s.poss = 1 - s.firstPoss; s.ballOn = 25; s.down = 1; s.toGo = 10; this.banner = 'HALFTIME'; return true; }
    if (s.quarter < 4) { s.quarter++; s.clock = this.qLen; this.banner = `END OF Q${s.quarter - 1}`; return true; }
    if (s.score[0] === s.score[1]) { s.ot = 1; s.poss = s.firstPoss; s.ballOn = 75; s.down = 1; s.toGo = 10; this.banner = 'OVERTIME!'; return true; }
    s.final = true; return true;

    if (m.banner) { const c = callout(m.banner, 5, m.banner === 'FINAL' ? 'fire' : 'chrome'); ctx.drawImage(c, (W - c.width) >> 1, 100); }
    // final
    if (m.report) { m.finalT = (m.finalT || 0) + 1 / 60; ctx.fillStyle = 'rgba(14,11,28,0.55)'; ctx.fillRect(0, 0, W, H);
      const c = callout(m.report.won ? 'VICTORY!' : m.report.tie ? 'TIE GAME' : 'DEFEAT', 4, m.report.won ? 'rainbow' : 'chrome'); ctx.drawImage(c, (W - c.width) >> 1, 80);
      textC(ctx, `${m.report.abbr[0]} ${m.report.score[0]}  -  ${m.report.score[1]} ${m.report.abbr[1]}`, W / 2, 140, PAL.white, PAL.ink, 2);
      if (m.finalT > 2) this.btn(ctx, 'continue', 'CONTINUE', (W - 140) / 2, 230, 140, 24, { primary: true }); }
    if (pd) { ctx.fillStyle = 'rgba(14,11,28,0.6)'; ctx.fillRect(0, 0, W, H);
      const pw = 220, px = (W - pw) / 2, py = 66; panel(ctx, px, py, pw, 150); const c = callout('PAUSED', 3, 'chrome'); ctx.drawImage(c, (W - c.width) / 2, py + 8);
      this.btn(ctx, 'resume', 'RESUME', px + 30, py + 48, pw - 60, 24, { primary: true }); this.btn(ctx, 'pause.settings', 'SETTINGS', px + 30, py + 80, pw - 60);
      this.btn(ctx, 'quit', 'QUIT TO MENU', px + 30, py + 112, pw - 60, 24, { danger: true }); }
  },
  drawCutin(ctx, m) {
    const c = m.cutin, t = m.timer, team = m.teams[c.team], J = hex(team.colors.primary), A = hex(team.colors.accent);
    ctx.fillStyle = 'rgba(14,11,28,0.55)'; ctx.fillRect(0, 0, W, H);
    const slide = Math.min(1, t / 0.18), y0 = 70, bh = 120;
    ctx.save(); ctx.beginPath(); ctx.moveTo(-40 + (1 - slide) * -600, y0 + 20); ctx.lineTo(W + 40, y0 - 10); ctx.lineTo(W + 40, y0 + bh - 10); ctx.lineTo(-40 + (1 - slide) * -600, y0 + bh + 20); ctx.closePath(); ctx.clip();
    rect(ctx, 0, 0, W, H, J);
    ctx.fillStyle = css(A, 0.35); for (let i = 0; i < 18; i++) { const yy = y0 + ((i * 37 + (t * 300 | 0)) % bh); ctx.fillRect(((i * 97) % W), yy, 60 + (i * 13) % 80, 2); }
    ctx.fillStyle = css(shade(J, -0.5), 0.6); for (let i = 0; i < 5; i++) ctx.fillRect(380 + i * 46, y0 - 10, 18, bh + 40);
    ctx.restore();
    const p = portrait(c.player, team, 'confident'); ctx.drawImage(p, 40 + (1 - slide) * -200, y0 - 4, 128, 128);
    const nm = callout(c.sp.name, 3, 'fire'); ctx.drawImage(nm, Math.min(190, 190 + (1 - slide) * 400), y0 + 22);
    text(ctx, c.player.lastName + '  #' + c.player.number, 194, y0 + 64, PAL.white, PAL.ink);
    wrap(c.sp.flavor, 380).forEach((l, i) => text(ctx, l, 194, y0 + 78 + i * 10, A, PAL.ink));
    if (t > 1.45) { ctx.fillStyle = `rgba(255,255,255,${(t - 1.45) / 0.15})`; ctx.fillRect(0, 0, W, H); }
  },
});

// ==== 10-main.js
// ---------------------------------------------------------------------------
// Boot: canvas scaling (integer "pixel perfect" or fill), pointer wiring and
// the frame loop.
// ---------------------------------------------------------------------------
const canvas = document.getElementById('screen');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d', { alpha: false }); ctx.imageSmoothingEnabled = false;
function fit() {
  const box = document.getElementById('stage'), r = box.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  let cw, ch;
  if (App.profile.settings.fit === 'fill') { const k = Math.min(r.width / W, r.height / H); cw = W * k; ch = H * k; }
  else { const s = Math.max(1, Math.floor(Math.min(r.width * dpr / W, r.height * dpr / H))); cw = W * s / dpr; ch = H * s / dpr;
    if (cw > r.width + 0.5 || ch > r.height + 0.5) { const k = Math.min(r.width / W, r.height / H); cw = W * k; ch = H * k; } }
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  document.getElementById('rotate').hidden = !(r.height > r.width * 1.1);
}
window.addEventListener('resize', fit); window.addEventListener('orientationchange', () => setTimeout(fit, 200));
function toCanvas(e) { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); canvas.setPointerCapture?.(e.pointerId); const [x, y] = toCanvas(e); App.pdown(e.pointerId, x, y); });
canvas.addEventListener('pointermove', (e) => { e.preventDefault(); const [x, y] = toCanvas(e); App.pmove(e.pointerId, x, y); });
const up = (e) => { e.preventDefault(); const [x, y] = toCanvas(e); App.pup(e.pointerId, x, y); };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
document.addEventListener('visibilitychange', () => { if (document.hidden && App.screen === 'game' && App.match && !App.match.report) App.go('pause'); if (document.hidden && Audio.ctx) Audio.ctx.suspend(); else if (Audio.ctx) Audio.ctx.resume(); });
window.addEventListener('keydown', () => Audio.unlock(), { once: false });
window.addEventListener('gamepadconnected', () => { Input.device = 'pad'; });

App.init();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  Input.frame();
  if (Input.pressed.length) Audio.unlock();
  App.update(dt);
  App.draw(ctx);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
setTimeout(fit, 50);
// Pre-render the soundtrack once audio is unlocked (keeps first tap snappy).
const warmIv = setInterval(() => { if (Audio.ctx) { clearInterval(warmIv); Audio.warm(); } }, 500);
window.GS = { App, Input, Audio, DATA, Match, Play };   // handle for the automated tests

})();
</script>
